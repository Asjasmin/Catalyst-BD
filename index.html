<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CatalystBD Workspace</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; overscroll-behavior-y: none; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Spinner */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid currentColor;
            width: 16px; height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Hide scrollbar for mobile nav */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SUPABASE_URL = "https://wxfpwgtvwrnnzdnljqtz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZnB3Z3R2d3JubnpkbmxqcXR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NDc2NzEsImV4cCI6MjEwMTMyMzY3MX0.tZxz4QjRwrB3pKpuzSPsLgJhanI4vNYpIbs5DHNf__I";

        const supabase = (SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_URL.includes('supabase.co')) 
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
            : null;

        const SECTORS = ["Tech", "Telecommunication", "Financial", "Brand Consumer & FMCG", "Government", "Automotive", "Other"];
        const STATUSES = ["Potential", "Approaching", "Past"];

        const CatalystLogo = () => (
            <svg viewBox="0 0 100 100" className="w-8 h-8 mr-3 shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="15" fill="#3b82f6" />
                <path d="M50 30L55 45L70 50L55 55L50 70L45 55L30 50L45 45L50 30Z" fill="white" />
                <circle cx="50" cy="50" r="28" stroke="#3b82f6" strokeWidth="3" strokeDasharray="8 8" opacity="0.6"/>
                <circle cx="50" cy="50" r="42" stroke="#60a5fa" strokeWidth="2" strokeDasharray="4 12" opacity="0.3"/>
            </svg>
        );

        const Dashboard = ({ clients, pitches, openSettings }) => {
            const metrics = [
                { label: "Total Leads", value: clients.length, icon: "users", color: "text-blue-600", bg: "bg-blue-100" },
                { label: "Active Pitches", value: pitches.length, icon: "mic", color: "text-purple-600", bg: "bg-purple-100" },
                { label: "Secured Clients", value: clients.filter(c => c.status === "Past").length, icon: "check-circle", color: "text-emerald-600", bg: "bg-emerald-100" }
            ];

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-6 md:space-y-8 pb-24 md:pb-8">
                    <div className="flex justify-between items-start">
                        <div>
                            <h2 className="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">Welcome back.</h2>
                            <p className="text-slate-500 mt-1 text-sm md:text-base">Your Business Development overview.</p>
                        </div>
                        <button onClick={openSettings} className="md:hidden bg-white p-2 rounded-full shadow-sm border border-slate-200 text-slate-600">
                            <i data-lucide="settings" className="w-5 h-5"></i>
                        </button>
                    </div>

                    {!supabase && (
                        <div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl flex items-start">
                            <i data-lucide="alert-triangle" className="w-5 h-5 mr-3 shrink-0 mt-0.5"></i>
                            <div>
                                <h4 className="font-bold text-sm">Database Not Connected</h4>
                                <p className="text-xs mt-1">Please add your Supabase URL and Anon Key to the index.html file to save data.</p>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-6">
                        {metrics.map((m, i) => (
                            <div key={i} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p className="text-xs md:text-sm text-slate-500 font-medium mb-1 uppercase tracking-wider">{m.label}</p>
                                    <h3 className="text-2xl md:text-3xl font-bold text-slate-800">{m.value}</h3>
                                </div>
                                <div className={`p-3 md:p-4 rounded-xl ${m.bg} ${m.color}`}>
                                    <i data-lucide={m.icon} className="w-5 h-5 md:w-6 md:h-6"></i>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6">
                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                            <i data-lucide="target" className="w-5 h-5 mr-2 text-blue-500"></i> Recent Leads
                        </h3>
                        <div className="space-y-3">
                            {clients.slice(0, 5).map(c => (
                                <div key={c.id} className="flex justify-between items-center p-3 md:p-4 bg-slate-50 rounded-xl border border-slate-100">
                                    <div className="flex items-center">
                                        <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold mr-3 shrink-0">
                                            {c.name.charAt(0)}
                                        </div>
                                        <div className="min-w-0">
                                            <p className="font-semibold text-slate-800 text-sm truncate">{c.name}</p>
                                            <p className="text-xs text-slate-500 truncate">{c.sector}</p>
                                        </div>
                                    </div>
                                    <span className="text-[10px] md:text-xs px-2 py-1 rounded-md font-medium bg-white border border-slate-200 text-slate-600 whitespace-nowrap ml-2">
                                        {c.status}
                                    </span>
                                </div>
                            ))}
                            {clients.length === 0 && <p className="text-sm text-slate-500 text-center py-4">No leads yet.</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const Hunter = ({ clients, saveClient, deleteClient, getGeminiKey, openSettings }) => {
            const [view, setView] = useState('crm'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState({ isOpen: false, id: null });
            const [isAutoFilling, setIsAutoFilling] = useState(false);
            
            const [formData, setFormData] = useState({ name: '', contact: '', whatsapp: '', status: 'Potential', sector: 'Tech', website: '', ig: '', li: '', yt: '', tiktok: '' });

            const [chatHistory, setChatHistory] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isBotTyping, setIsBotTyping] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => { if(view === 'strategy') chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, view]);

            const filteredClients = clients.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()) || c.sector.toLowerCase().includes(searchQuery.toLowerCase()));

            const handleSubmit = (e) => {
                e.preventDefault();
                saveClient(formData, editingId);
                setShowModal(false);
            };

            const formatWhatsAppLink = (number) => {
                if (!number) return null;
                let cleanNumber = number.replace(/\D/g, '');
                if (cleanNumber.startsWith('0')) {
                    cleanNumber = '62' + cleanNumber.substring(1);
                }
                return `https://wa.me/${cleanNumber}`;
            };

            const formatMarkdown = (text) => {
                if (!text) return { __html: '' };
                let html = text
                    .replace(/### (.*?)\n/g, '<h3 className="font-bold text-lg mt-4 mb-2 text-slate-800">$1</h3>')
                    .replace(/## (.*?)\n/g, '<h2 className="font-bold text-xl mt-4 mb-2 text-slate-800">$1</h2>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\n\* /g, '<br/>• ') 
                    .replace(/\n- /g, '<br/>• ') 
                    .replace(/\n/g, '<br/>'); 
                return { __html: html };
            };

            const handleAutoFill = async () => {
                const apiKey = getGeminiKey();
                if(!apiKey) { openSettings(); return; }
                if(!formData.name) { alert("Please enter a company name first."); return; }
                
                setIsAutoFilling(true);
                try {
                    const prompt = `Find official online presence for company "${formData.name}" in Indonesia. Return ONLY JSON: {"website":"", "ig":"", "li":"", "yt":"", "tiktok":""}`;
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, { 
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], tools: [{ "google_search": {} }], generationConfig: { responseMimeType: "application/json" } }) 
                    });
                    const data = await res.json();
                    if(data.error) throw new Error(data.error.message);
                    
                    const jsonText = data.candidates[0].content.parts[0].text;
                    setFormData(prev => ({ ...prev, ...JSON.parse(jsonText) }));
                } catch (err) { alert("AI Auto-fill Error: " + err.message); }
                setIsAutoFilling(false);
            };

            const handleSendChat = async (e) => {
                e.preventDefault();
                if(!chatInput.trim()) return;
                const apiKey = getGeminiKey();
                if(!apiKey) { openSettings(); return; }
                
                const userMsg = { role: 'user', text: chatInput };
                setChatHistory(prev => [...prev, userMsg]);
                setChatInput('');
                setIsBotTyping(true);

                const contents = chatHistory.map(msg => ({ role: msg.role === 'user' ? 'user' : 'model', parts: [{ text: msg.text }] }));
                contents.push({ role: 'user', parts: [{ text: userMsg.text }] });

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, { 
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({
                            contents: contents, tools: [{ "google_search": {} }],
                            systemInstruction: { parts: [{ text: "You are an elite Business Development Strategist. ALWAYS structure responses in exactly 3 sections: \n### 1. Client Brief Input\nBriefly summarize client/opportunity.\n### 2. Event Strategy Recommendation\nHighly creative, data-backed activation ideas.\n### 3. Pitch Deck Structure Recommendation\nSlide-by-slide outline." }] }
                        }) 
                    });
                    const data = await res.json();
                    if(data.error) throw new Error(data.error.message);
                    let text = data.candidates[0].content.parts[0].text;
                    setChatHistory(prev => [...prev, { role: 'model', text }]);
                } catch (err) {
                    setChatHistory(prev => [...prev, { role: 'model', text: `**Error:** ${err.message}` }]);
                }
                setIsBotTyping(false);
            };

            return (
                <div className="h-full flex flex-col bg-white relative">
                    <div className="px-4 md:px-8 py-4 md:py-6 border-b border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-50 gap-4">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-slate-800 flex items-center">
                                <i data-lucide="target" className="w-5 h-5 md:w-6 md:h-6 mr-2 text-blue-600"></i> The Hunter
                            </h2>
                            <p className="text-slate-500 text-xs md:text-sm mt-1">Client Pipeline & Strategy</p>
                        </div>
                        <div className="flex space-x-1 md:space-x-2 bg-slate-200 p-1 rounded-xl w-full md:w-auto">
                            <button onClick={() => setView('crm')} className={`flex-1 md:flex-none px-4 py-2.5 rounded-lg text-sm font-bold transition-all ${view === 'crm' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}>CRM Database</button>
                            <button onClick={() => setView('strategy')} className={`flex-1 md:flex-none px-4 py-2.5 rounded-lg text-sm font-bold transition-all flex items-center justify-center ${view === 'strategy' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}>
                                <i data-lucide="sparkles" className="w-4 h-4 mr-1.5 text-purple-500"></i> AI Strategist
                            </button>
                        </div>
                    </div>

                    {}
                    {view === 'crm' && (
                        <div className="flex-1 flex flex-col min-h-0 overflow-hidden bg-slate-50">
                            <div className="p-4 md:p-8 flex-1 overflow-y-auto pb-24 md:pb-8">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                                    <div className="relative w-full md:w-72">
                                        <i data-lucide="search" className="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                                        <input type="text" placeholder="Search clients or sectors..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
                                    </div>
                                    <button onClick={() => { setEditingId(null); setFormData({ name: '', contact: '', whatsapp: '', status: 'Potential', sector: 'Tech', website: '', ig: '', li: '', yt: '', tiktok: '' }); setShowModal(true); }} className="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center shadow-sm transition-colors">
                                        <i data-lucide="plus" className="w-4 h-4 mr-1.5"></i> Add Target Lead
                                    </button>
                                </div>
                                
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse min-w-[800px]">
                                            <thead className="bg-slate-50 border-b border-slate-100 text-slate-500 text-xs uppercase tracking-wider">
                                                <tr>
                                                    <th className="p-4 font-bold">Company</th>
                                                    <th className="p-4 font-bold">Contact Person</th>
                                                    <th className="p-4 font-bold">Status</th>
                                                    <th className="p-4 font-bold">Digital Footprint</th>
                                                    <th className="p-4 font-bold text-right">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {filteredClients.map(c => (
                                                    <tr key={c.id} className="hover:bg-slate-50/50 transition-colors">
                                                        <td className="p-4">
                                                            <p className="font-bold text-slate-800 text-base">{c.name}</p>
                                                            <div className="text-xs text-slate-500 mt-0.5">{c.sector}</div>
                                                            {c.website && <a href={c.website.startsWith('http') ? c.website : `https://${c.website}`} target="_blank" className="text-xs text-blue-500 hover:underline mt-1 block truncate max-w-[200px]">{c.website}</a>}
                                                        </td>
                                                        <td className="p-4">
                                                            <p className="text-sm font-medium text-slate-700">{c.contact || '-'}</p>
                                                            {c.whatsapp && (
                                                                <a href={formatWhatsAppLink(c.whatsapp)} target="_blank" className="text-xs text-green-600 hover:text-green-700 font-medium flex items-center mt-1">
                                                                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-3.5 h-3.5 mr-1"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                                                                    WhatsApp
                                                                </a>
                                                            )}
                                                        </td>
                                                        <td className="p-4">
                                                            <span className={`text-[11px] px-2.5 py-1 rounded-md font-bold uppercase tracking-wider border ${
                                                                c.status === 'Potential' ? 'bg-slate-50 border-slate-200 text-slate-600' :
                                                                c.status === 'Approaching' ? 'bg-blue-50 border-blue-200 text-blue-700' :
                                                                'bg-emerald-50 border-emerald-200 text-emerald-700'
                                                            }`}>{c.status}</span>
                                                        </td>
                                                        <td className="p-4">
                                                            <div className="flex space-x-2.5 text-slate-400">
                                                                {c.li && <a href={c.li} target="_blank" className="hover:text-blue-700 text-blue-500 transition-colors"><i data-lucide="linkedin" className="w-5 h-5"></i></a>}
                                                                {c.ig && <a href={c.ig} target="_blank" className="hover:text-pink-600 text-pink-500 transition-colors"><i data-lucide="instagram" className="w-5 h-5"></i></a>}
                                                                {c.yt && <a href={c.yt} target="_blank" className="hover:text-red-600 text-red-500 transition-colors"><i data-lucide="youtube" className="w-5 h-5"></i></a>}
                                                                {c.tiktok && <a href={c.tiktok} target="_blank" className="hover:text-slate-800 text-slate-600 transition-colors"><svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 15.68a6.34 6.34 0 0 0 6.26 6.32 6.32 6.32 0 0 0 6.23-6.3V8.14a8.3 8.3 0 0 0 3.1 1.09V5.81a5.05 5.05 0 0 1-1.04-.12z"/></svg></a>}
                                                                {!c.li && !c.ig && !c.yt && !c.tiktok && <span className="text-xs text-slate-300">No links</span>}
                                                            </div>
                                                        </td>
                                                        <td className="p-4 text-right">
                                                            <div className="flex justify-end space-x-1">
                                                                <button onClick={() => { setEditingId(c.id); setFormData(c); setShowModal(true); }} className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"><i data-lucide="edit-2" className="w-4 h-4"></i></button>
                                                                <button onClick={() => setDeleteConfirm({isOpen: true, id: c.id})} className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {filteredClients.length === 0 && <tr><td colSpan="5" className="p-12 text-center text-slate-400"><i data-lucide="inbox" className="w-8 h-8 mx-auto mb-3 opacity-50"></i>No clients found. Start hunting!</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {view === 'strategy' && (
                        <div className="flex-1 flex flex-col min-h-0 bg-slate-50/50 pb-20 md:pb-0">
                            <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                                {chatHistory.length === 0 && (
                                    <div className="h-full flex flex-col items-center justify-center text-center max-w-lg mx-auto">
                                        <div className="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center mb-6 shadow-sm">
                                            <i data-lucide="sparkles" className="w-10 h-10 text-purple-600"></i>
                                        </div>
                                        <h3 className="text-2xl font-bold text-slate-800 mb-3">Catalyst AI Strategist</h3>
                                        <p className="text-slate-500 text-sm md:text-base leading-relaxed">Ask me to research a brand, analyze trends, or build an approach strategy. I will automatically format the output into Briefs, Strategies, and Pitch Deck outlines.</p>
                                        <div className="mt-8 flex flex-wrap justify-center gap-3">
                                            <button onClick={() => setChatInput("Research Gojek Indonesia's latest marketing campaigns.")} className="text-xs font-semibold bg-white border border-slate-200 hover:border-purple-300 hover:text-purple-700 text-slate-600 px-4 py-2 rounded-full transition-all shadow-sm">Research Gojek</button>
                                            <button onClick={() => setChatInput("What are the current event marketing trends for EV vehicles in Jakarta?")} className="text-xs font-semibold bg-white border border-slate-200 hover:border-purple-300 hover:text-purple-700 text-slate-600 px-4 py-2 rounded-full transition-all shadow-sm">EV Trends in Jakarta</button>
                                        </div>
                                    </div>
                                )}
                                {chatHistory.map((msg, i) => (
                                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>

            const [clients, setClients] = useState([]);
            const [pitches, setPitches] = useState([]);
            const [errorMsg, setErrorMsg] = useState(null);
            const [successMsg, setSuccessMsg] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [apiKeyInput, setApiKeyInput] = useState('');

            const fetchClients = async () => {
                if(!supabase) return;
                const { data, error } = await supabase.from('clients').select('*').order('created_at', { ascending: false });
                if (error) setErrorMsg("Failed to load clients."); else setClients(data || []);
            };
            const fetchPitches = async () => {
                if(!supabase) return;
                const { data, error } = await supabase.from('pitches').select('*').order('created_at', { ascending: false });
                if (error) setErrorMsg("Failed to load pitches."); else setPitches(data || []);
            };

            useEffect(() => { fetchClients(); fetchPitches(); }, []);
            useEffect(() => { lucide.createIcons(); }, [activeTab, clients, pitches, errorMsg, successMsg, showSettings]);
            useEffect(() => {
                if(errorMsg || successMsg) {
                    const timer = setTimeout(() => { setErrorMsg(null); setSuccessMsg(null); }, 4000);
                    return () => clearTimeout(timer);
                }
            }, [errorMsg, successMsg]);

            const saveClient = async (data, id) => {
                if(!supabase) return setErrorMsg("Supabase not connected.");
                try {
                    const payload = { ...data };
                    Object.keys(payload).forEach(key => { if(payload[key] === '') payload[key] = null; });
                    let res = id ? await supabase.from('clients').update(payload).eq('id', id) : await supabase.from('clients').insert([payload]);
                    if (res.error) throw res.error; 
                    setSuccessMsg(id ? "Client Updated!" : "Client Added!");
                    fetchClients();
                } catch (err) { setErrorMsg("Save Failed: " + err.message); }
            };

            const deleteClient = async (id) => {
                if(!supabase) return;
                try {
                    let res = await supabase.from('clients').delete().eq('id', id);
                    if (res.error) throw res.error;
                    setSuccessMsg("Client Deleted.");
                    fetchClients(); fetchPitches(); 
                } catch (err) { setErrorMsg("Delete Failed: " + err.message); }
            };

            const savePitch = async (data, id) => {
                if(!supabase) return setErrorMsg("Supabase not connected.");
                try {
                    const payload = { ...data };
                    Object.keys(payload).forEach(key => { if(payload[key] === '') payload[key] = null; });
                    let res = id ? await supabase.from('pitches').update(payload).eq('id', id) : await supabase.from('pitches').insert([payload]);
                    if (res.error) throw res.error; 
                    setSuccessMsg(id ? "Pitch Updated!" : "Pitch Project Created!");
                    fetchPitches();
                } catch (err) { setErrorMsg("Save Failed: " + err.message); }
            };

            const deletePitch = async (id) => {
                if(!supabase) return;
                try {
                    let res = await supabase.from('pitches').delete().eq('id', id);
                    if (res.error) throw res.error;
                    setSuccessMsg("Pitch Deleted.");
                    fetchPitches();
                } catch (err) { setErrorMsg("Delete Failed: " + err.message); }
            };

            const getGeminiKey = () => localStorage.getItem('catalyst_gemini_key');
            const saveApiKey = (e) => {
                e.preventDefault();
                localStorage.setItem('catalyst_gemini_key', apiKeyInput);
                setShowSettings(false);
                setSuccessMsg("API Key Saved Securely!");
            };
            const openSettings = () => {
                setApiKeyInput(getGeminiKey() || '');
                setShowSettings(true);
            };

            const nav = [
                { id: 'dashboard', label: 'Overview', icon: 'layout-dashboard' },
                { id: 'hunter', label: '1. Hunter', icon: 'target' },
                { id: 'pitcher', label: '2. Pitcher', icon: 'presentation' },
                { id: 'manager', label: '3. Manager', icon: 'kanban' },
                { id: 'farmer', label: '4. Farmer', icon: 'sprout' }
            ];

            return (
                <div className="flex flex-col md:flex-row h-[100dvh] overflow-hidden bg-slate-100 font-sans">
                    
                    {}
                    <nav className="md:w-64 bg-slate-900 text-slate-300 flex md:flex-col h-16 md:h-full border-t md:border-t-0 md:border-r border-slate-800 order-last md:order-first shrink-0 z-50">
                        <div className="p-6 hidden md:flex items-center border-b border-slate-800 mb-4 shrink-0">
                            <CatalystLogo />
                            <div><h1 className="text-xl font-bold text-white tracking-tight">Catalyst<span className="text-blue-500">BD</span></h1></div>
                        </div>
                        <div className="flex-1 px-2 md:px-4 flex md:flex-col justify-around md:justify-start md:space-y-2 overflow-x-auto md:overflow-visible no-scrollbar w-full">
                            {nav.map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex md:w-full flex-col md:flex-row items-center justify-center md:justify-start p-2 md:p-3 rounded-lg transition-all duration-200 shrink-0 min-w-[70px] ${activeTab === item.id ? 'text-blue-400 md:bg-blue-600 md:text-white md:shadow-md' : 'hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide={item.icon} className="w-5 h-5 md:mr-3 mb-1 md:mb-0"></i>
                                    <span className="text-[10px] md:text-sm font-medium">{item.label}</span>
                                </button>
                            ))}
                        </div>
                        <div className="p-4 border-t border-slate-800 hidden md:block mt-auto shrink-0">
                            <button onClick={openSettings} className="w-full flex items-center justify-center p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors text-sm font-medium">
                                <i data-lucide="settings" className="w-4 h-4 mr-2"></i> Settings
                            </button>
                            <div className="text-[10px] text-slate-500 text-center mt-4">CatalystBD v3.0 &bull; Professional</div>
                        </div>
                    </nav>

                    {}
                    <main className="flex-1 overflow-hidden relative flex flex-col min-w-0 bg-slate-50 md:rounded-l-2xl shadow-[-10px_0_15px_-3px_rgba(0,0,0,0.1)] md:mt-2 md:mb-2 md:mr-2 border border-slate-200">
                        {activeTab === 'dashboard' && <Dashboard clients={clients} pitches={pitches} openSettings={openSettings} />}
                        {activeTab === 'hunter' && <Hunter clients={clients} saveClient={saveClient} deleteClient={deleteClient} getGeminiKey={getGeminiKey} openSettings={openSettings} />}
                        {activeTab === 'pitcher' && <Pitcher pitches={pitches} clients={clients} savePitch={savePitch} deletePitch={deletePitch} />}
                        {(activeTab === 'manager' || activeTab === 'farmer') && (
                            <div className="h-full flex flex-col items-center justify-center bg-slate-50 p-8 text-center pb-24 md:pb-8">
                                <div className="w-24 h-24 rounded-3xl bg-slate-200 flex items-center justify-center mb-6"><i data-lucide={nav.find(n=>n.id===activeTab).icon} className="w-12 h-12 text-slate-400"></i></div>
                                <h2 className="text-3xl font-bold text-slate-800 mb-3">{nav.find(n=>n.id===activeTab).label}</h2>
                                <p className="text-slate-500 max-w-md mx-auto">This module is scheduled for the next development phase.</p>
                                <div className="mt-8 px-4 py-2 bg-slate-200 text-slate-600 rounded-full text-sm font-semibold uppercase tracking-widest">In Development</div>
                            </div>
                        )}
                    </main>

                    {}
                    {showSettings && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-lg text-slate-800 flex items-center"><i data-lucide="settings" className="w-5 h-5 mr-2"></i> Settings</h3>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-slate-600 bg-slate-100 p-1.5 rounded-lg"><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <form onSubmit={saveApiKey} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">Google Gemini API Key</label>
                                        <p className="text-xs text-slate-500 mb-3 leading-relaxed">Your API key is securely saved directly in your browser's local memory. It is never uploaded to GitHub or Vercel.</p>
                                        <input type="password" required value={apiKeyInput} onChange={e=>setApiKeyInput(e.target.value)} className="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono" placeholder="AIzaSy..." />
                                    </div>
                                    <div className="pt-4 flex justify-end space-x-3">
                                        <button type="button" onClick={() => setShowSettings(false)} className="px-5 py-2.5 text-slate-600 font-medium hover:bg-slate-100 rounded-xl text-sm">Cancel</button>
                                        <button type="submit" className="px-6 py-2.5 bg-slate-900 hover:bg-black text-white font-bold rounded-xl shadow-md text-sm">Save Key</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <div className="fixed top-4 right-4 z-[200] flex flex-col space-y-2 pointer-events-none">
                        {errorMsg && (
                            <div className="bg-red-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-start max-w-sm animate-[slideIn_0.3s_ease-out]">
                                <i data-lucide="alert-triangle" className="w-5 h-5 mr-3 shrink-0 mt-0.5"></i>
                                <span className="font-medium text-sm leading-tight">{errorMsg}</span>
                                <button onClick={()=>setErrorMsg(null)} className="ml-4 shrink-0 pointer-events-auto opacity-70 hover:opacity-100"><i data-lucide="x" className="w-4 h-4"></i></button>
                            </div>
                        )}
                        {successMsg && (
                            <div className="bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center max-w-sm animate-[slideIn_0.3s_ease-out]">
                                <i data-lucide="check-circle" className="w-5 h-5 mr-3 shrink-0"></i>
                                <span className="font-medium text-sm">{successMsg}</span>
                                <button onClick={()=>setSuccessMsg(null)} className="ml-4 shrink-0 pointer-events-auto opacity-70 hover:opacity-100"><i data-lucide="x" className="w-4 h-4"></i></button>
                            </div>
                        )}
                    </div>
                    <style dangerouslySetInnerHTML={{__html: `@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }`}} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
