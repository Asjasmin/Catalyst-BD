<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>CatalystBD Workspace</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase JS Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        /* Mobile Scroll Fixes */
        html, body, #root { height: 100%; width: 100%; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .chat-bubble-ai { background: #f1f5f9; border-bottom-left-radius: 2px; }
        .chat-bubble-user { background: #3b82f6; color: white; border-bottom-right-radius: 2px; }
        
        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // 🚨 PASTE YOUR SUPABASE KEYS HERE 🚨
        // Do NOT paste your Gemini API key here anymore!
        // ==========================================
        const SUPABASE_URL = "https://wxfpwgtvwrnnzdnljqtz.supabase.co/rest/v1/";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZnB3Z3R2d3JubnpkbmxqcXR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NDc2NzEsImV4cCI6MjEwMTMyMzY3MX0.tZxz4QjRwrB3pKpuzSPsLgJhanI4vNYpIbs5DHNf__I";

        const supabase = (SUPABASE_URL !== "https://wxfpwgtvwrnnzdnljqtz.supabase.co/rest/v1/" && SUPABASE_URL.includes('supabase.co')) 
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
            : null;

        const SECTORS = ["Tech", "Telecommunication", "Financial", "Brand Consumer & FMCG", "Government", "Automotive", "Other"];
        const STATUSES = ["Potential", "Approaching", "Past"];
        const NAV_ITEMS = [
            { id: 'dashboard', label: 'Overview', icon: 'layout-dashboard' },
            { id: 'hunter', label: '1. Hunter', icon: 'target' },
            { id: 'pitcher', label: '2. Pitcher', icon: 'presentation' },
            { id: 'manager', label: '3. Manager', icon: 'kanban' },
            { id: 'farmer', label: '4. Farmer', icon: 'sprout' }
        ];

        const CatalystLogo = () => (
            <svg viewBox="0 0 100 100" className="w-8 h-8 flex-shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="15" fill="#3b82f6" />
                <path d="M50 30L55 45L70 50L55 55L50 70L45 55L30 50L45 45L50 30Z" fill="white" />
                <circle cx="50" cy="50" r="28" stroke="#3b82f6" strokeWidth="3" strokeDasharray="8 8" opacity="0.6"/>
                <circle cx="50" cy="50" r="42" stroke="#60a5fa" strokeWidth="2" strokeDasharray="4 12" opacity="0.3"/>
            </svg>
        );

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl">
                        <h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-6">{message}</p>
                        <div className="flex justify-end space-x-3">
                            <button onClick={onCancel} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                            <button onClick={onConfirm} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg">Delete</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AlertToast = ({ message, type, onClose }) => {
            if (!message) return null;
            return (
                <div className={`fixed top-4 right-4 left-4 md:left-auto z-[200] p-4 rounded-xl shadow-lg flex items-center justify-between ${type === 'error' ? 'bg-red-600' : 'bg-emerald-600'} text-white`}>
                    <div className="flex items-center">
                        <i data-lucide={type === 'error' ? 'alert-triangle' : 'check-circle'} className="w-5 h-5 mr-3"></i>
                        <p className="font-medium text-sm">{message}</p>
                    </div>
                    <button onClick={onClose} className="ml-4 opacity-80 hover:opacity-100"><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
            );
        };

        const Dashboard = ({ clients, pitches, openSettings }) => {
            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-6">
                    <div className="flex justify-between items-start">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Overview</h2>
                            <p className="text-slate-500 text-sm">Your business development metrics.</p>
                        </div>
                        <button onClick={openSettings} className="p-2 bg-blue-100 text-blue-600 rounded-full hover:bg-blue-200">
                            <i data-lucide="settings" className="w-5 h-5"></i>
                        </button>
                    </div>
                    
                    {!supabase && (
                        <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-start">
                            <i data-lucide="alert-triangle" className="w-5 h-5 mr-3 mt-0.5"></i>
                            <div>
                                <h4 className="font-bold">Database Not Connected</h4>
                                <p className="text-sm">Please check your Supabase Keys in GitHub.</p>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <div className="text-blue-600 mb-2"><i data-lucide="users" className="w-6 h-6"></i></div>
                            <h3 className="text-2xl font-bold">{clients.length}</h3>
                            <p className="text-xs text-slate-500">Total Leads</p>
                        </div>
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <div className="text-purple-600 mb-2"><i data-lucide="mic" className="w-6 h-6"></i></div>
                            <h3 className="text-2xl font-bold">{pitches.length}</h3>
                            <p className="text-xs text-slate-500">Active Pitches</p>
                        </div>
                    </div>
                </div>
            );
        };

        const Hunter = ({ clients, saveClient, deleteClient, getGeminiKey, openSettings }) => {
            const [view, setView] = useState('crm'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState({ isOpen: false, id: null });
            const [isAutoFilling, setIsAutoFilling] = useState(false);
            const [formData, setFormData] = useState({ name: '', contact: '', status: 'Potential', sector: 'Tech', website: '', ig: '', li: '', yt: '', tiktok: '' });

            const [chatHistory, setChatHistory] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isBotTyping, setIsBotTyping] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => { if(view === 'strategy') chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, view]);

            const filteredClients = clients.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()) || c.sector.toLowerCase().includes(searchQuery.toLowerCase()));

            const handleSubmit = (e) => {
                e.preventDefault();
                saveClient(formData, editingId);
                setShowModal(false);
            };

            const handleAutoFill = async () => {
                const apiKey = getGeminiKey();
                if (!apiKey) { alert("Please click the Settings gear to add your Gemini API Key first!"); return openSettings(); }
                if (!formData.name) return alert("Please type a Company Name first!");

                setIsAutoFilling(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, { 
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Find official online presence for "${formData.name}" in Indonesia. Return ONLY JSON keys: website, ig, li, yt, tiktok.` }] }],
                            tools: [{ "google_search": {} }],
                            generationConfig: { responseMimeType: "application/json" }
                        }) 
                    });
                    const data = await res.json();
                    if(data.error) throw new Error(data.error.message);
                    setFormData(prev => ({ ...prev, ...JSON.parse(data.candidates[0].content.parts[0].text) }));
                } catch (err) { alert("AI Error: " + err.message); }
                setIsAutoFilling(false);
            };

            const handleSendChat = async (e) => {
                e.preventDefault();
                if(!chatInput.trim()) return;
                
                const apiKey = getGeminiKey();
                if (!apiKey) { alert("Please click Settings to add your Gemini API Key!"); return openSettings(); }

                const userMsg = { role: 'user', text: chatInput };
                setChatHistory(prev => [...prev, userMsg]);
                setChatInput('');
                setIsBotTyping(true);

                const contents = chatHistory.map(msg => ({ role: msg.role === 'user' ? 'user' : 'model', parts: [{ text: msg.text }] }));
                contents.push({ role: 'user', parts: [{ text: userMsg.text }] });

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, { 
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({
                            contents: contents, tools: [{ "google_search": {} }],
                            systemInstruction: { parts: [{ text: "You are an elite Business Development Strategist. ALWAYS use this structure:\n1. **Client Brief Input**: Summarize client.\n2. **Event Strategy Recommendation**: Creative ideas based on market trends.\n3. **Pitch Deck Structure Recommendation**: Slide-by-slide outline." }] }
                        }) 
                    });
                    const data = await res.json();
                    if(data.error) throw new Error(data.error.message);
                    setChatHistory(prev => [...prev, { role: 'model', text: data.candidates[0].content.parts[0].text }]);
                } catch (err) {
                    setChatHistory(prev => [...prev, { role: 'model', text: `**Error:** ${err.message}` }]);
                }
                setIsBotTyping(false);
            };

            return (
                <div className="h-full flex flex-col bg-white">
                    <ConfirmModal isOpen={deleteConfirm.isOpen} title="Delete Client" message="Are you sure?" onConfirm={() => { deleteClient(deleteConfirm.id); setDeleteConfirm({isOpen: false, id: null}); }} onCancel={() => setDeleteConfirm({isOpen: false, id: null})} />

                    <div className="p-4 border-b bg-slate-50 flex flex-col md:flex-row md:justify-between space-y-3 md:space-y-0 shrink-0">
                        <div>
                            <h2 className="text-xl font-bold flex items-center"><i data-lucide="target" className="w-5 h-5 mr-2 text-blue-600"></i> The Hunter</h2>
                        </div>
                        <div className="flex space-x-1 bg-slate-200 p-1 rounded-lg">
                            <button onClick={() => setView('crm')} className={`px-3 py-1.5 rounded-md text-sm ${view === 'crm' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}>CRM Tracker</button>
                            <button onClick={() => setView('strategy')} className={`px-3 py-1.5 rounded-md text-sm flex items-center ${view === 'strategy' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}><i data-lucide="sparkles" className="w-4 h-4 mr-1 text-purple-500"></i> AI Strategist</button>
                        </div>
                    </div>

                    {view === 'crm' && (
                        <div className="flex-1 overflow-y-auto p-4 bg-slate-50">
                            <div className="flex flex-col md:flex-row justify-between mb-4 space-y-2 md:space-y-0">
                                <div className="relative w-full md:w-64">
                                    <i data-lucide="search" className="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                                    <input type="text" placeholder="Search clients..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 rounded-lg border text-sm" />
                                </div>
                                <button onClick={() => { setEditingId(null); setFormData({ name: '', contact: '', status: 'Potential', sector: 'Tech', website: '', ig: '', li: '', yt: '', tiktok: '' }); setShowModal(true); }} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm flex items-center justify-center">
                                    <i data-lucide="plus" className="w-4 h-4 mr-1"></i> Add Target
                                </button>
                            </div>
                            
                            <div className="bg-white rounded-xl shadow-sm border overflow-x-auto">
                                <table className="w-full text-left min-w-[700px]">
                                    <thead className="bg-slate-100 text-slate-500 text-xs">
                                        <tr><th className="p-4">Company</th><th className="p-4">Status & Sector</th><th className="p-4">Actions</th></tr>
                                    </thead>
                                    <tbody className="divide-y text-sm">
                                        {filteredClients.map(c => (
                                            <tr key={c.id}>
                                                <td className="p-4 font-semibold">{c.name}</td>
                                                <td className="p-4"><span className="block text-xs text-slate-500">{c.sector}</span><span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded font-bold">{c.status}</span></td>
                                                <td className="p-4 space-x-2">
                                                    <button onClick={() => { setEditingId(c.id); setFormData(c); setShowModal(true); }} className="p-1.5 bg-slate-100 rounded"><i data-lucide="edit" className="w-4 h-4"></i></button>
                                                    <button onClick={() => setDeleteConfirm({isOpen: true, id: c.id})} className="p-1.5 bg-red-50 text-red-600 rounded"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {view === 'strategy' && (
                        <div className="flex-1 flex flex-col bg-slate-50 overflow-hidden">
                            <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                {chatHistory.length === 0 && <div className="text-center mt-10 text-slate-500">Ask AI Strategist to research a brand!</div>}
                                {chatHistory.map((msg, i) => (
                                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[90%] p-4 rounded-2xl text-sm ${msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-white border'}`} dangerouslySetInnerHTML={{__html: msg.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br/>')}}></div>
                                    </div>
                                ))}
                                {isBotTyping && <div className="p-4 bg-white border w-16 text-slate-400">...</div>}
                                <div ref={chatEndRef}></div>
                            </div>
                            <form onSubmit={handleSendChat} className="p-3 bg-white border-t flex relative">
                                <input type="text" value={chatInput} onChange={e=>setChatInput(e.target.value)} placeholder="Ask Strategy AI..." className="w-full pl-4 pr-12 py-3 rounded-xl border text-sm" />
                                <button type="submit" disabled={isBotTyping} className="absolute right-4 top-4 bg-blue-600 text-white rounded-lg p-1.5"><i data-lucide="send" className="w-4 h-4"></i></button>
                            </form>
                        </div>
                    )}

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col">
                                <div className="p-4 border-b flex justify-between"><h3 className="font-bold">{editingId ? 'Edit' : 'Add'} Client</h3><button onClick={() => setShowModal(false)}><i data-lucide="x" className="w-5 h-5"></i></button></div>
                                <form onSubmit={handleSubmit} className="p-4 overflow-y-auto space-y-3">
                                    <label className="block text-xs font-semibold">Company Name *</label>
                                    <input required type="text" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm" />
                                    <button type="button" onClick={handleAutoFill} className="w-full bg-indigo-50 text-indigo-700 py-2 rounded-lg text-sm flex justify-center"><i data-lucide="sparkles" className="w-4 h-4 mr-2"></i> Auto-fill Socials</button>
                                    
                                    <label className="block text-xs font-semibold">Sector & Status</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <select value={formData.sector} onChange={e=>setFormData({...formData, sector: e.target.value})} className="border rounded-lg px-3 py-2 text-sm">{SECTORS.map(s => <option key={s} value={s}>{s}</option>)}</select>
                                        <select value={formData.status} onChange={e=>setFormData({...formData, status: e.target.value})} className="border rounded-lg px-3 py-2 text-sm">{STATUSES.map(s => <option key={s} value={s}>{s}</option>)}</select>
                                    </div>
                                    <button type="submit" className="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg text-sm">Save Client</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Pitcher = ({ pitches, clients, savePitch, deletePitch }) => {
            const [showModal, setShowModal] = useState(false);
            const [formData, setFormData] = useState({ client_id: '', name: '', deck_link: '' });
            const [deleteConfirm, setDeleteConfirm] = useState({ isOpen: false, id: null });

            return (
                <div className="h-full flex flex-col bg-slate-50">
                    <ConfirmModal isOpen={deleteConfirm.isOpen} title="Delete Pitch" message="Are you sure?" onConfirm={() => { deletePitch(deleteConfirm.id); setDeleteConfirm({isOpen: false, id: null}); }} onCancel={() => setDeleteConfirm({isOpen: false, id: null})} />
                    <div className="p-4 flex justify-between items-center bg-white border-b shrink-0">
                        <h2 className="text-xl font-bold flex items-center"><i data-lucide="presentation" className="w-5 h-5 mr-2 text-purple-600"></i> The Pitcher</h2>
                        <button onClick={() => { setFormData({ client_id: clients[0]?.id || '', name: '', deck_link: '' }); setShowModal(true); }} className="bg-purple-600 text-white px-3 py-2 rounded-lg text-sm"><i data-lucide="plus" className="w-4 h-4 inline"></i> New</button>
                    </div>
                    
                    <div className="p-4 flex-1 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-4">
                        {pitches.map(p => (
                            <div key={p.id} className="bg-white rounded-xl shadow-sm border p-4">
                                <div className="flex justify-between">
                                    <h3 className="font-bold">{p.name}</h3>
                                    <button onClick={() => setDeleteConfirm({isOpen: true, id: p.id})} className="text-red-500"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                </div>
                                <p className="text-sm text-purple-600 mb-4">{clients.find(c => c.id === p.client_id)?.name}</p>
                                {p.deck_link && <a href={p.deck_link} target="_blank" className="block text-center bg-slate-100 py-2 rounded text-sm"><i data-lucide="link" className="w-4 h-4 inline"></i> View Deck</a>}
                            </div>
                        ))}
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm p-4">
                                <h3 className="font-bold mb-4">New Pitch</h3>
                                <form onSubmit={(e) => { e.preventDefault(); savePitch(formData, null); setShowModal(false); }} className="space-y-3">
                                    <select required value={formData.client_id} onChange={e=>setFormData({...formData, client_id: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm"><option value="">Select Client...</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select>
                                    <input required type="text" placeholder="Pitch Name" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm" />
                                    <input type="url" placeholder="Deck Link" value={formData.deck_link} onChange={e=>setFormData({...formData, deck_link: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm" />
                                    <button type="submit" className="w-full bg-purple-600 text-white py-2 rounded-lg">Save</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [clients, setClients] = useState([]);
            const [pitches, setPitches] = useState([]);
            const [errorMsg, setErrorMsg] = useState(null);
            const [successMsg, setSuccessMsg] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [localGeminiKey, setLocalGeminiKey] = useState(localStorage.getItem('gemini_api_key') || '');

            const getGeminiKey = () => localStorage.getItem('gemini_api_key');

            const fetchClients = async () => {
                if(!supabase) return;
                const { data, error } = await supabase.from('clients').select('*').order('created_at', { ascending: false });
                if(data) setClients(data);
                if(error) setErrorMsg("Database Error: " + error.message);
            };

            const fetchPitches = async () => {
                if(!supabase) return;
                const { data, error } = await supabase.from('pitches').select('*').order('created_at', { ascending: false });
                if(data) setPitches(data);
                if(error) setErrorMsg("Database Error: " + error.message);
            };

            useEffect(() => { fetchClients(); fetchPitches(); }, []);
            useEffect(() => { lucide.createIcons(); });

            const saveClient = async (data, id) => {
                if(!supabase) return setErrorMsg("Database not connected!");
                try {
                    let res = id ? await supabase.from('clients').update(data).eq('id', id) : await supabase.from('clients').insert([data]);
                    if (res.error) throw res.error;
                    setSuccessMsg("Saved!"); fetchClients();
                } catch (err) { setErrorMsg(err.message); }
            };

            const deleteClient = async (id) => {
                try {
                    let res = await supabase.from('clients').delete().eq('id', id);
                    if(res.error) throw res.error; fetchClients();
                } catch (err) { setErrorMsg(err.message); }
            };
            
            const savePitch = async (data) => {
                try {
                    let res = await supabase.from('pitches').insert([data]);
                    if (res.error) throw res.error; fetchPitches();
                } catch (err) { setErrorMsg(err.message); }
            };

            const deletePitch = async (id) => {
                try { await supabase.from('pitches').delete().eq('id', id); fetchPitches(); } catch (err) { setErrorMsg(err.message); }
            };

            return (
                <div className="flex flex-col md:flex-row h-full overflow-hidden bg-slate-100">
                    <AlertToast message={errorMsg} type="error" onClose={() => setErrorMsg(null)} />
                    <AlertToast message={successMsg} type="success" onClose={() => setSuccessMsg(null)} />

                    {/* Desktop Nav */}
                    <div className="hidden md:flex w-64 bg-slate-900 text-slate-300 flex-col h-full shrink-0">
                        <div className="p-6 flex items-center mb-4"><CatalystLogo /><h1 className="ml-3 font-bold text-white">CatalystBD</h1></div>
                        <nav className="flex-1 px-4 space-y-2">
                            {NAV_ITEMS.map(i => <button key={i.id} onClick={() => setActiveTab(i.id)} className={`w-full flex p-3 rounded-lg ${activeTab === i.id ? 'bg-blue-600 text-white' : 'hover:bg-slate-800'}`}><i data-lucide={i.icon} className="w-5 h-5 mr-3"></i>{i.label}</button>)}
                        </nav>
                        <button onClick={() => setShowSettings(true)} className="m-4 p-3 border border-slate-700 rounded-lg text-sm flex items-center justify-center hover:bg-slate-800"><i data-lucide="settings" className="w-4 h-4 mr-2"></i> Settings (API Key)</button>
                    </div>

                    {/* Main Content Area - Mobile Scrolling Fixed Here */}
                    <main className="flex-1 relative overflow-hidden flex flex-col pb-16 md:pb-0">
                        <div className="flex-1 overflow-y-auto w-full h-full">
                            {activeTab === 'dashboard' && <Dashboard clients={clients} pitches={pitches} openSettings={() => setShowSettings(true)} />}
                            {activeTab === 'hunter' && <Hunter clients={clients} saveClient={saveClient} deleteClient={deleteClient} getGeminiKey={getGeminiKey} openSettings={() => setShowSettings(true)} />}
                            {activeTab === 'pitcher' && <Pitcher pitches={pitches} clients={clients} savePitch={savePitch} deletePitch={deletePitch} />}
                        </div>
                    </main>

                    {/* Mobile Bottom Nav */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white border-t z-50 flex justify-around items-center">
                        {NAV_ITEMS.slice(0,4).map(i => (
                            <button key={i.id} onClick={() => setActiveTab(i.id)} className={`flex flex-col items-center justify-center w-full h-full ${activeTab === i.id ? 'text-blue-600' : 'text-slate-400'}`}>
                                <i data-lucide={i.icon} className="w-5 h-5 mb-1"></i><span className="text-[10px]">{i.label.split(' ')[1] || i.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* Secure Settings for Gemini Key (Prevents Leaks!) */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[300] p-4">
                            <div className="bg-white rounded-2xl w-full max-w-md p-6">
                                <div className="flex justify-between mb-4"><h3 className="font-bold text-lg">App Settings</h3><button onClick={() => setShowSettings(false)}><i data-lucide="x" className="w-5 h-5"></i></button></div>
                                <div className="bg-blue-50 text-blue-800 text-xs p-3 rounded-lg mb-4"><strong>Secure Setup:</strong> Paste your Gemini API key here. It saves locally to your device to prevent GitHub leaks.</div>
                                <input type="password" value={localGeminiKey} onChange={(e) => setLocalGeminiKey(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-sm mb-4" placeholder="AIzaSy..." />
                                <button onClick={() => { localStorage.setItem('gemini_api_key', localGeminiKey); setSuccessMsg("Key saved locally."); setShowSettings(false); }} className="w-full bg-blue-600 text-white py-2 rounded-lg text-sm">Save Key</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
