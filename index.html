<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CatalystBD Workspace</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase JS Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .chat-bubble-ai { background: #f1f5f9; border-bottom-left-radius: 2px; }
        .chat-bubble-user { background: #3b82f6; color: white; border-bottom-right-radius: 2px; }
        
        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .mobile-pb { padding-bottom: 80px; }
        @media (min-width: 768px) { .mobile-pb { padding-bottom: 0; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // 🚨 REPLACE THESE WITH YOUR ACTUAL KEYS 🚨
        // ==========================================
        const SUPABASE_URL = "https://wxfpwgtvwrnnzdnljqtz.supabase.co/rest/v1/";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZnB3Z3R2d3JubnpkbmxqcXR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NDc2NzEsImV4cCI6MjEwMTMyMzY3MX0.tZxz4QjRwrB3pKpuzSPsLgJhanI4vNYpIbs5DHNf__I";
        const GEMINI_API_KEY = "AQ.Ab8RN6Jl93JqyWy2_mwnioux4aLpQN12cUJm9GOKvRcEu3ffMw"; 
        
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`;

        // Initialize Supabase Client
        const supabase = (SUPABASE_URL !== "YOUR_SUPABASE_URL") 
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
            : null;

        // Constants
        const SECTORS = ["Tech", "Telecommunication", "Financial", "Brand Consumer & FMCG", "Government", "Automotive", "Other"];
        const STATUSES = ["Potential", "Approaching", "Past"];
        const NAV_ITEMS = [
            { id: 'dashboard', label: 'Overview', icon: 'layout-dashboard' },
            { id: 'hunter', label: '1. Hunter', icon: 'target' },
            { id: 'pitcher', label: '2. Pitcher', icon: 'presentation' },
            { id: 'manager', label: '3. Manager', icon: 'kanban' },
            { id: 'farmer', label: '4. Farmer', icon: 'sprout' }
        ];

        const TikTokIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 15.68a6.34 6.34 0 0 0 6.27 6.32 6.32 6.32 0 0 0 6.22-5.71V8.62a8.3 8.3 0 0 0 4.2 1.13V6.3a4.7 4.7 0 0 1-2.1-.61Z"/>
            </svg>
        );

        const CatalystLogo = () => (
            <svg viewBox="0 0 100 100" className="w-8 h-8 flex-shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="15" fill="#3b82f6" />
                <path d="M50 30L55 45L70 50L55 55L50 70L45 55L30 50L45 45L50 30Z" fill="white" />
                <circle cx="50" cy="50" r="28" stroke="#3b82f6" strokeWidth="3" strokeDasharray="8 8" opacity="0.6"/>
                <circle cx="50" cy="50" r="42" stroke="#60a5fa" strokeWidth="2" strokeDasharray="4 12" opacity="0.3"/>
            </svg>
        );

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl">
                        <h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-6">{message}</p>
                        <div className="flex justify-end space-x-3">
                            <button onClick={onCancel} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition-colors">Cancel</button>
                            <button onClick={onConfirm} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition-colors">Delete</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ clients, pitches }) => {
            const metrics = [
                { label: "Total Leads", value: clients.length, icon: "users", color: "text-blue-600", bg: "bg-blue-100" },
                { label: "Active Pitches", value: pitches.length, icon: "mic", color: "text-purple-600", bg: "bg-purple-100" },
                { label: "Secured Clients", value: clients.filter(c => c.status === "Past").length, icon: "check-circle", color: "text-emerald-600", bg: "bg-emerald-100" }
            ];

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-6 md:space-y-8 h-full overflow-y-auto mobile-pb">
                    <div>
                        <h2 className="text-2xl md:text-3xl font-bold text-slate-800">Overview</h2>
                        <p className="text-slate-500 text-sm md:text-base mt-1">Your business development metrics at a glance.</p>
                    </div>
                    
                    {!supabase && (
                        <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-start">
                            <i data-lucide="alert-triangle" className="w-5 h-5 mr-3 mt-0.5"></i>
                            <div>
                                <h4 className="font-bold">Supabase Not Connected</h4>
                                <p className="text-sm">Please open the code and add your Supabase URL and Anon Key to enable saving.</p>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                        {metrics.map((m, i) => (
                            <div key={i} className="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p className="text-sm text-slate-500 font-medium mb-1">{m.label}</p>
                                    <h3 className="text-2xl md:text-3xl font-bold text-slate-800">{m.value}</h3>
                                </div>
                                <div className={`p-3 md:p-4 rounded-xl ${m.bg} ${m.color}`}>
                                    <i data-lucide={m.icon} className="w-5 h-5 md:w-6 md:h-6"></i>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6">
                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                            <i data-lucide="target" className="w-5 h-5 mr-2 text-purple-500"></i> Recent Leads
                        </h3>
                        <div className="space-y-4">
                            {clients.length === 0 ? <p className="text-slate-500 text-sm">No leads yet.</p> : 
                            clients.slice(0, 5).map(c => (
                                <div key={c.id} className="flex justify-between items-center p-3 md:p-4 border border-slate-100 rounded-xl bg-slate-50">
                                    <div className="flex items-center">
                                        <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold mr-3 flex-shrink-0">
                                            {c.name.charAt(0)}
                                        </div>
                                        <div>
                                            <p className="font-semibold text-sm md:text-base text-slate-800 truncate max-w-[150px] md:max-w-xs">{c.name}</p>
                                            <p className="text-xs text-slate-500">{c.sector}</p>
                                        </div>
                                    </div>
                                    <span className={`text-xs px-2 py-1 rounded-md font-medium whitespace-nowrap ${
                                        c.status === 'Potential' ? 'bg-slate-200 text-slate-700' :
                                        c.status === 'Approaching' ? 'bg-blue-100 text-blue-700' :
                                        'bg-emerald-100 text-emerald-700'
                                    }`}>{c.status}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const Hunter = ({ clients, saveClient, deleteClient }) => {
            const [view, setView] = useState('crm'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState({ isOpen: false, id: null });
            const [isAutoFilling, setIsAutoFilling] = useState(false);
            
            const [formData, setFormData] = useState({ name: '', contact: '', status: 'Potential', sector: 'Tech', website: '', ig: '', li: '', yt: '', tiktok: '' });

            const [chatHistory, setChatHistory] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isBotTyping, setIsBotTyping] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => { if(view === 'strategy') chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, view]);

            const filteredClients = clients.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()) || c.sector.toLowerCase().includes(searchQuery.toLowerCase()));

            const openAddModal = () => {
                setEditingId(null);
                setFormData({ name: '', contact: '', status: 'Potential', sector: 'Tech', website: '', ig: '', li: '', yt: '', tiktok: '' });
                setShowModal(true);
            };

            const openEditModal = (client) => {
                setEditingId(client.id);
                setFormData(client);
                setShowModal(true);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                saveClient(formData, editingId);
                setShowModal(false);
            };

            const handleAutoFill = async () => {
                if(!formData.name) return;
                setIsAutoFilling(true);
                const prompt = `Find the official online presence for "${formData.name}" in Indonesia. Return ONLY a JSON object with these exact keys: website, ig, li, yt, tiktok. Leave empty string if not found.`;
                try {
                    const res = await fetch(API_URL, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            tools: [{ "google_search": {} }],
                            generationConfig: {
                                responseMimeType: "application/json",
                                responseSchema: { type: "OBJECT", properties: { website: { type: "STRING" }, ig: { type: "STRING" }, li: { type: "STRING" }, yt: { type: "STRING" }, tiktok: { type: "STRING" } } }
                            }
                        }) 
                    });
                    const data = await res.json();
                    if(data.candidates?.[0]?.content?.parts?.[0]?.text) {
                        setFormData(prev => ({ ...prev, ...JSON.parse(data.candidates[0].content.parts[0].text) }));
                    }
                } catch (err) { console.error(err); }
                setIsAutoFilling(false);
            };

            const handleSendChat = async (e) => {
                e.preventDefault();
                if(!chatInput.trim()) return;
                const userMsg = { role: 'user', text: chatInput };
                setChatHistory(prev => [...prev, userMsg]);
                setChatInput('');
                setIsBotTyping(true);

                const contents = chatHistory.map(msg => ({ role: msg.role === 'user' ? 'user' : 'model', parts: [{ text: msg.text }] }));
                contents.push({ role: 'user', parts: [{ text: userMsg.text }] });

                try {
                    const res = await fetch(API_URL, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({
                            contents: contents,
                            tools: [{ "google_search": {} }],
                            systemInstruction: { parts: [{ text: "You are an elite Business Development Strategist acting as a 'Catalyst' for an event and creative agency. Provide actionable ideation, market trends, and strategies based on real data.\n\nCRITICAL INSTRUCTION: You MUST structure every single response EXACTLY with these three sections, using these exact headings:\n\n1. **Client Brief Input**: Briefly summarize your understanding of the target client, their current market position, and the core opportunity based on the user's prompt.\n2. **Event Strategy Recommendation**: Provide highly creative, data-backed activation ideas and approaching models. Use real market trends retrieved from your search capabilities.\n3. **Pitch Deck Structure Recommendation**: Outline a recommended slide-by-slide structure (e.g., Slide 1: Hook, Slide 2: Data Insight, etc.) to present these strategies effectively to the client." }] }
                        }) 
                    });
                    const data = await res.json();
                    let text = data.candidates[0].content.parts[0].text;
                    setChatHistory(prev => [...prev, { role: 'model', text }]);
                } catch (err) {
                    setChatHistory(prev => [...prev, { role: 'model', text: "Error connecting to AI network. Check your Gemini API Key." }]);
                }
                setIsBotTyping(false);
            };

            return (
                <div className="h-full flex flex-col bg-white mobile-pb">
                    <ConfirmModal 
                        isOpen={deleteConfirm.isOpen} 
                        title="Delete Client" 
                        message="Are you sure you want to delete this client? This cannot be undone."
                        onConfirm={() => { deleteClient(deleteConfirm.id); setDeleteConfirm({isOpen: false, id: null}); }}
                        onCancel={() => setDeleteConfirm({isOpen: false, id: null})}
                    />

                    <div className="px-4 md:px-8 py-4 md:py-6 border-b border-slate-200 flex flex-col md:flex-row md:justify-between md:items-center bg-slate-50 space-y-4 md:space-y-0">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-slate-800 flex items-center">
                                <i data-lucide="target" className="w-5 h-5 md:w-6 md:h-6 mr-2 text-blue-600"></i> The Hunter
                            </h2>
                            <p className="text-slate-500 text-xs md:text-sm mt-1">CRM Pipeline & Strategy</p>
                        </div>
                        <div className="flex space-x-1 bg-slate-200 p-1 rounded-lg self-start">
                            <button onClick={() => setView('crm')} className={`px-3 md:px-4 py-2 rounded-md text-xs md:text-sm font-medium transition-colors ${view === 'crm' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}>CRM Tracker</button>
                            <button onClick={() => setView('strategy')} className={`px-3 md:px-4 py-2 rounded-md text-xs md:text-sm font-medium transition-colors flex items-center ${view === 'strategy' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}>
                                <i data-lucide="sparkles" className="w-4 h-4 mr-1 text-purple-500"></i> AI Strategist
                            </button>
                        </div>
                    </div>

                    {}
                    {view === 'crm' && (
                        <div className="p-4 md:p-8 flex-1 overflow-y-auto bg-slate-50 flex flex-col">
                            <div className="flex flex-col md:flex-row md:justify-between md:items-center mb-4 md:mb-6 space-y-3 md:space-y-0">
                                <div className="relative w-full md:w-64">
                                    <i data-lucide="search" className="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                                    <input type="text" placeholder="Search clients..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <button onClick={openAddModal} className="w-full md:w-auto bg-blue-600 hover:bg-blue-700 transition-colors text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center shadow-sm">
                                    <i data-lucide="plus" className="w-4 h-4 mr-1"></i> Add Target
                                </button>
                            </div>
                            
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                                <table className="w-full text-left min-w-[800px]">
                                    <thead className="bg-slate-100/50 border-b border-slate-200 text-slate-500 text-xs md:text-sm uppercase tracking-wider">
                                        <tr>
                                            <th className="p-4 font-medium">Company</th>
                                            <th className="p-4 font-medium">Status & Sector</th>
                                            <th className="p-4 font-medium">Contact</th>
                                            <th className="p-4 font-medium">Socials</th>
                                            <th className="p-4 font-medium text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {filteredClients.map(c => (
                                            <tr key={c.id} className="hover:bg-slate-50">
                                                <td className="p-4">
                                                    <p className="font-semibold text-slate-800">{c.name}</p>
                                                    {c.website && <a href={c.website.startsWith('http') ? c.website : `https://${c.website}`} target="_blank" className="text-xs text-blue-500 hover:underline truncate block max-w-[200px]">{c.website.replace('https://','')}</a>}
                                                </td>
                                                <td className="p-4">
                                                    <span className="block text-xs font-semibold mb-1 text-slate-600">{c.sector}</span>
                                                    <span className={`text-[10px] px-2 py-0.5 rounded-md font-bold uppercase tracking-wide border ${c.status === 'Potential' ? 'bg-slate-50 text-slate-500 border-slate-200' : c.status === 'Approaching' ? 'bg-blue-50 text-blue-600 border-blue-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}`}>{c.status}</span>
                                                </td>
                                                <td className="p-4 text-slate-600">{c.contact || '-'}</td>
                                                <td className="p-4">
                                                    <div className="flex space-x-3 text-slate-400">
                                                        {c.li && <a href={c.li} target="_blank"><i data-lucide="linkedin" className="w-4 h-4 hover:text-blue-700 cursor-pointer"></i></a>}
                                                        {c.ig && <a href={c.ig} target="_blank"><i data-lucide="instagram" className="w-4 h-4 hover:text-pink-600 cursor-pointer"></i></a>}
                                                        {c.yt && <a href={c.yt} target="_blank"><i data-lucide="youtube" className="w-4 h-4 hover:text-red-600 cursor-pointer"></i></a>}
                                                        {c.tiktok && <a href={c.tiktok} target="_blank"><TikTokIcon className="w-4 h-4 hover:text-black cursor-pointer" /></a>}
                                                    </div>
                                                </td>
                                                <td className="p-4 text-right space-x-2">
                                                    <button onClick={() => openEditModal(c)} className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-md transition-colors"><i data-lucide="edit" className="w-4 h-4"></i></button>
                                                    <button onClick={() => setDeleteConfirm({isOpen: true, id: c.id})} className="p-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-md transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                        {filteredClients.length === 0 && (
                                            <tr><td colSpan="5" className="p-8 text-center text-slate-500">No clients found. Add a new target to get started!</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {}
                    {view === 'strategy' && (
                        <div className="flex-1 flex flex-col bg-slate-50">
                            <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
                                {chatHistory.length === 0 && (
                                    <div className="h-full flex flex-col items-center justify-center text-center max-w-md mx-auto">
                                        <div className="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4">
                                            <i data-lucide="sparkles" className="w-8 h-8 text-blue-600"></i>
                                        </div>
                                        <h3 className="text-xl font-bold text-slate-800 mb-2">Catalyst Intelligence</h3>
                                        <p className="text-slate-500 text-sm">Ask me to research a potential client. I will analyze their market position, generate event strategies, and outline a pitch deck structure for you.</p>
                                    </div>
                                )}
                                {chatHistory.map((msg, i) => (
                                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[90%] md:max-w-[80%] p-4 rounded-2xl text-sm ${msg.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai border border-slate-200'}`} dangerouslySetInnerHTML={{__html: msg.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br/>')}}></div>
                                    </div>
                                ))}
                                {isBotTyping && <div className="chat-bubble-ai p-4 rounded-2xl w-16 flex justify-center space-x-1"><div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></div><div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay:'0.2s'}}></div></div>}
                                <div ref={chatEndRef}></div>
                            </div>
                            <div className="p-3 md:p-4 bg-white border-t border-slate-200">
                                <form onSubmit={handleSendChat} className="flex relative max-w-4xl mx-auto">
                                    <input type="text" value={chatInput} onChange={e=>setChatInput(e.target.value)} placeholder="Ask AI Strategist (e.g., Generate a pitch idea for Gojek)..." className="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm" />
                                    <button type="submit" disabled={isBotTyping || !chatInput} className="absolute right-2 top-2 bottom-2 bg-blue-600 hover:bg-blue-700 transition-colors text-white rounded-lg px-3 flex items-center justify-center disabled:opacity-50"><i data-lucide="send" className="w-4 h-4"></i></button>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-2 md:p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
                                <div className="px-4 md:px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                                    <h3 className="font-bold text-lg text-slate-800">{editingId ? 'Edit Client' : 'Add Client'}</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:bg-slate-200 p-1 rounded-md"><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <form onSubmit={handleSubmit} className="p-4 md:p-6 overflow-y-auto space-y-4 md:space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">Company Name *</label>
                                            <input required type="text" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
                                        </div>
                                        <div className="flex items-end">
                                            <button type="button" onClick={handleAutoFill} disabled={isAutoFilling} className="w-full bg-indigo-50 hover:bg-indigo-100 transition-colors text-indigo-700 border border-indigo-200 font-medium py-2 px-3 rounded-lg flex justify-center items-center text-sm">
                                                {isAutoFilling ? <div className="spinner w-4 h-4 mr-2 border-indigo-600"></div> : <i data-lucide="sparkles" className="w-4 h-4 mr-2"></i>}
                                                {isAutoFilling ? 'Searching...' : 'Spark AI Auto-fill'}
                                            </button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="sm:col-span-2"><label className="block text-xs font-semibold text-slate-500 mb-1">Contact Person</label><input type="text" value={formData.contact} onChange={e=>setFormData({...formData, contact: e.target.value})} placeholder="Name & Role" className="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" /></div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">Sector</label>
                                            <select value={formData.sector} onChange={e=>setFormData({...formData, sector: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm outline-none bg-white focus:ring-2 focus:ring-blue-500">
                                                {SECTORS.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                                            <select value={formData.status} onChange={e=>setFormData({...formData, status: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm outline-none bg-white focus:ring-2 focus:ring-blue-500">
                                                {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="border-t pt-4"><h4 className="text-sm font-semibold mb-3">Links & Socials</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            <div className="flex items-center"><i data-lucide="globe" className="w-4 h-4 mr-2 text-slate-400"></i><input type="text" placeholder="Website" value={formData.website} onChange={e=>setFormData({...formData, website: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" /></div>
                                            <div className="flex items-center"><i data-lucide="linkedin" className="w-4 h-4 mr-2 text-slate-400"></i><input type="text" placeholder="LinkedIn URL" value={formData.li} onChange={e=>setFormData({...formData, li: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" /></div>
                                            <div className="flex items-center"><i data-lucide="instagram" className="w-4 h-4 mr-2 text-slate-400"></i><input type="text" placeholder="Instagram URL" value={formData.ig} onChange={e=>setFormData({...formData, ig: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" /></div>
                                            <div className="flex items-center"><TikTokIcon className="w-4 h-4 mr-2 text-slate-400" /><input type="text" placeholder="TikTok URL" value={formData.tiktok} onChange={e=>setFormData({...formData, tiktok: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" /></div>
                                        </div>
                                    </div>
                                    <div className="flex justify-end pt-4 space-x-3">
                                        <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition-colors">Cancel</button>
                                        <button type="submit" className="px-6 py-2 bg-blue-600 hover:bg-blue-700 transition-colors text-white rounded-lg font-medium text-sm shadow-md">Save Client</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Pitcher = ({ pitches, clients, savePitch, deletePitch }) => {
            const [searchQuery, setSearchQuery] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState({ isOpen: false, id: null });
            const [formData, setFormData] = useState({ client_id: '', name: '', deck_link: '', sub_date: '', pitch_date: '', event_date: '' });

            const filteredPitches = pitches.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));

            const openAddModal = () => {
                setEditingId(null);
                setFormData({ client_id: clients[0]?.id || '', name: '', deck_link: '', sub_date: '', pitch_date: '', event_date: '' });
                setShowModal(true);
            };

            const openEditModal = (pitch) => {
                setEditingId(pitch.id);
                setFormData(pitch);
                setShowModal(true);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                savePitch(formData, editingId);
                setShowModal(false);
            };

            const generateGCalLink = (pitch) => {
                const client = clients.find(c => c.id === pitch.client_id);
                const title = encodeURIComponent(`Pitch: ${pitch.name} - ${client ? client.name : 'Client'}`);
                
                const formatForGCal = (dateString) => {
                    if(!dateString) return "";
                    const d = new Date(dateString);
                    return d.toISOString().replace(/-|:|\.\d\d\d/g,"");
                };

                let datesStr = "";
                if(pitch.pitch_date) {
                    const start = formatForGCal(pitch.pitch_date);
                    const end = formatForGCal(new Date(new Date(pitch.pitch_date).getTime() + 60*60*1000));
                    datesStr = `&dates=${start}/${end}`;
                }

                const details = encodeURIComponent(`Client: ${client ? client.name : 'N/A'}\nDeck Link: ${pitch.deck_link || 'None provided'}\nSubmission Deadline: ${pitch.sub_date || 'N/A'}\nEvent Date: ${pitch.event_date || 'N/A'}`);
                return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}${datesStr}&details=${details}`;
            };

            return (
                <div className="h-full flex flex-col bg-slate-50 mobile-pb">
                    <ConfirmModal 
                        isOpen={deleteConfirm.isOpen} title="Delete Pitch" message="Are you sure you want to delete this pitch project?"
                        onConfirm={() => { deletePitch(deleteConfirm.id); setDeleteConfirm({isOpen: false, id: null}); }}
                        onCancel={() => setDeleteConfirm({isOpen: false, id: null})}
                    />

                    <div className="px-4 md:px-8 py-4 md:py-6 flex flex-col md:flex-row justify-between items-start md:items-center bg-white border-b space-y-4 md:space-y-0 shadow-sm z-10">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-slate-800 flex items-center">
                                <i data-lucide="presentation" className="w-5 h-5 md:w-6 md:h-6 mr-2 text-purple-600"></i> The Pitcher
                            </h2>
                            <p className="text-slate-500 text-xs md:text-sm mt-1">Creative Decks, Briefings & Deadlines</p>
                        </div>
                        <div className="flex w-full md:w-auto space-x-2">
                            <div className="relative flex-1 md:w-64">
                                <i data-lucide="search" className="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                                <input type="text" placeholder="Search projects..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 shadow-sm" />
                            </div>
                            <button onClick={openAddModal} className="bg-purple-600 hover:bg-purple-700 transition-colors text-white px-3 py-2 rounded-lg text-sm font-medium flex-shrink-0 flex items-center shadow-md">
                                <i data-lucide="plus" className="w-4 h-4 md:mr-1"></i> <span className="hidden md:inline">New Pitch</span>
                            </button>
                        </div>
                    </div>

                    <div className="p-4 md:p-8 flex-1 overflow-y-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                        {filteredPitches.map(p => {
                            const client = clients.find(c => c.id === p.client_id);
                            return (
                                <div key={p.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col relative group">
                                    <div className="absolute top-4 right-4 flex space-x-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                                        <button onClick={() => openEditModal(p)} className="p-1.5 bg-slate-100 text-slate-600 rounded hover:text-purple-600 transition-colors"><i data-lucide="edit" className="w-4 h-4"></i></button>
                                        <button onClick={() => setDeleteConfirm({isOpen: true, id: p.id})} className="p-1.5 bg-red-50 text-red-600 rounded hover:bg-red-100 transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                    </div>
                                    <h3 className="font-bold text-lg pr-16 text-slate-800 leading-tight">{p.name}</h3>
                                    <p className="text-sm text-purple-600 font-medium mb-4 mt-1">{client ? client.name : 'Unknown Client'}</p>
                                    
                                    <div className="space-y-3 mb-6 flex-1 text-sm text-slate-600">
                                        <div className="flex items-center"><i data-lucide="alert-circle" className="w-4 h-4 mr-2 text-amber-500"></i><span className="w-20 font-medium">Submission:</span> {p.sub_date || '-'}</div>
                                        <div className="flex items-center"><i data-lucide="calendar" className="w-4 h-4 mr-2 text-blue-500"></i><span className="w-20 font-medium">Pitch Date:</span> {p.pitch_date ? new Date(p.pitch_date).toLocaleString() : '-'}</div>
                                        <div className="flex items-center"><i data-lucide="flag" className="w-4 h-4 mr-2 text-emerald-500"></i><span className="w-20 font-medium">Event/Live:</span> {p.event_date || '-'}</div>
                                    </div>
                                    <div className="flex space-x-2 pt-4 border-t border-slate-100">
                                        {p.deck_link ? (
                                            <a href={p.deck_link} target="_blank" className="flex-1 bg-slate-100 hover:bg-slate-200 transition-colors text-slate-700 text-center py-2 rounded-lg text-sm font-medium flex justify-center items-center"><i data-lucide="link" className="w-4 h-4 mr-1"></i> View Deck</a>
                                        ) : (
                                            <div className="flex-1 bg-slate-50 text-slate-400 text-center py-2 rounded-lg text-sm font-medium flex justify-center items-center"><i data-lucide="link-2-off" className="w-4 h-4 mr-1"></i> No Deck</div>
                                        )}
                                        <a href={generateGCalLink(p)} target="_blank" className="flex-1 bg-white border border-slate-200 hover:border-blue-400 hover:text-blue-600 transition-colors text-center py-2 rounded-lg text-sm font-medium flex justify-center items-center shadow-sm"><i data-lucide="calendar-plus" className="w-4 h-4 mr-1"></i> GCal Add</a>
                                    </div>
                                </div>
                            )
                        })}
                        {filteredPitches.length === 0 && (
                            <div className="col-span-full py-12 text-center bg-white rounded-2xl border border-dashed border-slate-300">
                                <div className="w-16 h-16 bg-purple-50 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i data-lucide="presentation" className="w-8 h-8 text-purple-400"></i>
                                </div>
                                <h3 className="text-lg font-medium text-slate-700">No active pitch projects</h3>
                                <p className="text-slate-500 mt-1">Start a new pitch linked to your CRM clients.</p>
                            </div>
                        )}
                    </div>

                    {}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
                                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-lg text-slate-800">{editingId ? 'Edit Pitch Project' : 'New Pitch Project'}</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600"><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <form onSubmit={handleSubmit} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Related Client *</label>
                                        <select required value={formData.client_id} onChange={e=>setFormData({...formData, client_id: e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none bg-white">
                                            <option value="">Select a client...</option>
                                            {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Project Name *</label>
                                        <input required type="text" placeholder="e.g. Q4 Brand Activation" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Creative Deck Link (Docs/Canva)</label>
                                        <input type="url" placeholder="https://..." value={formData.deck_link} onChange={e=>setFormData({...formData, deck_link: e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Submission Date</label>
                                            <input type="date" value={formData.sub_date} onChange={e=>setFormData({...formData, sub_date: e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Pitch Meeting Date & Time</label>
                                            <input type="datetime-local" value={formData.pitch_date} onChange={e=>setFormData({...formData, pitch_date: e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none" />
                                        </div>
                                        <div className="col-span-2">
                                            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Actual Event / Live Date</label>
                                            <input type="date" value={formData.event_date} onChange={e=>setFormData({...formData, event_date: e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none" />
                                        </div>
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-4">
                                        <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition-colors">Cancel</button>
                                        <button type="submit" className="px-6 py-2 bg-purple-600 hover:bg-purple-700 transition-colors text-white rounded-lg font-medium shadow-md text-sm">{editingId ? 'Save Changes' : 'Create Pitch'}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [clients, setClients] = useState([]);
            const [pitches, setPitches] = useState([]);

            const fetchClients = async () => {
                if(!supabase) return;
                const { data, error } = await supabase.from('clients').select('*').order('created_at', { ascending: false });
                if(data) setClients(data);
                if(error) console.error("Error fetching clients:", error);
            };

            const fetchPitches = async () => {
                if(!supabase) return;
                const { data, error } = await supabase.from('pitches').select('*').order('created_at', { ascending: false });
                if(data) setPitches(data);
                if(error) console.error("Error fetching pitches:", error);
            };

            useEffect(() => {
                if(!supabase) return;
                fetchClients();
                fetchPitches();

                // Setup Real-time Listeners via Supabase Channels
                const channel = supabase.channel('schema-db-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'clients' }, fetchClients)
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'pitches' }, fetchPitches)
                    .subscribe();

                return () => { supabase.removeChannel(channel); }
            }, []);

            useEffect(() => { lucide.createIcons(); }, [activeTab, clients, pitches]);

            // Database Operations
            const saveClient = async (data, id) => {
                if(!supabase) return;
                const payload = { ...data };
                delete payload.id; delete payload.created_at;

                if (id) {
                    await supabase.from('clients').update(payload).eq('id', id);
                } else {
                    await supabase.from('clients').insert([payload]);
                }
            };
            const deleteClient = async (id) => await supabase.from('clients').delete().eq('id', id);
            
            const savePitch = async (data, id) => {
                if(!supabase) return;
                const payload = { ...data };
                delete payload.id; delete payload.created_at;

                if(!payload.sub_date) payload.sub_date = null;
                if(!payload.pitch_date) payload.pitch_date = null;
                if(!payload.event_date) payload.event_date = null;

                if (id) {
                    await supabase.from('pitches').update(payload).eq('id', id);
                } else {
                    await supabase.from('pitches').insert([payload]);
                }
            };
            const deletePitch = async (id) => await supabase.from('pitches').delete().eq('id', id);

            return (
                <div className="flex h-screen overflow-hidden bg-slate-100 font-sans">
                    {/* Desktop Sidebar */}
                    <div className="hidden md:flex w-64 bg-slate-900 text-slate-300 flex-col h-full z-20 shadow-xl border-r border-slate-800">
                        <div className="p-6 flex items-center border-b border-slate-800 mb-4">
                            <CatalystLogo />
                            <h1 className="ml-3 text-xl font-bold text-white tracking-tight">Catalyst<span className="text-blue-500">BD</span></h1>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            {NAV_ITEMS.map(i => (
                                <button key={i.id} onClick={() => setActiveTab(i.id)} className={`w-full flex items-center p-3 rounded-lg transition-all duration-200 ${activeTab === i.id ? 'bg-blue-600 text-white shadow-md shadow-blue-900/50' : 'hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide={i.icon} className="w-5 h-5 mr-3"></i><span className="font-medium">{i.label}</span>
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">CatalystBD v3.0 &bull; Supabase</div>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 relative overflow-hidden shadow-[inset_0_0_20px_rgba(0,0,0,0.02)]">
                        {activeTab === 'dashboard' && <Dashboard clients={clients} pitches={pitches} />}
                        {activeTab === 'hunter' && <Hunter clients={clients} saveClient={saveClient} deleteClient={deleteClient} />}
                        {activeTab === 'pitcher' && <Pitcher pitches={pitches} clients={clients} savePitch={savePitch} deletePitch={deletePitch} />}
                        {(activeTab === 'manager' || activeTab === 'farmer') && (
                            <div className="h-full flex flex-col items-center justify-center p-8 text-center bg-slate-50 mobile-pb">
                                <div className={`w-24 h-24 rounded-3xl ${activeTab==='manager'?'bg-amber-100 text-amber-500':'bg-emerald-100 text-emerald-500'} flex items-center justify-center mb-6`}>
                                    <i data-lucide={activeTab==='manager'?'kanban':'sprout'} className="w-12 h-12"></i>
                                </div>
                                <h2 className="text-2xl font-bold text-slate-800 mb-2">{activeTab === 'manager' ? 'Project Manager Workspace' : 'Client Retention Tracker'}</h2>
                                <p className="text-slate-500 max-w-md">This advanced module is currently in development and will be activated in the next phase.</p>
                            </div>
                        )}
                    </main>

                    {/* Mobile Bottom Nav */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 flex justify-around pb-safe shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
                        {NAV_ITEMS.slice(0,4).map(i => (
                            <button key={i.id} onClick={() => setActiveTab(i.id)} className={`flex flex-col items-center justify-center w-full py-3 transition-colors ${activeTab === i.id ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                <i data-lucide={i.icon} className="w-6 h-6 mb-1"></i>
                                <span className="text-[10px] font-medium">{i.label.replace(/[0-9].\s/g, '')}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
