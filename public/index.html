<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CatalystBD Workspace</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .chat-bubble-ai { background: #f1f5f9; border-bottom-left-radius: 2px; }
        .chat-bubble-user { background: #3b82f6; color: white; border-bottom-right-radius: 2px; }
        
        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Mobile padding adjustment for bottom nav */
        .mobile-pb { padding-bottom: 80px; }
        @media (min-width: 768px) { .mobile-pb { padding-bottom: 0; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, addDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const { useState, useEffect, useRef } = React;

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'catalyst-bd-app';

        // Constants
        const SECTORS = ["Tech", "Telecommunication", "Financial", "Brand Consumer & FMCG", "Government", "Automotive", "Other"];
        const STATUSES = ["Potential", "Approaching", "Past"];
        const NAV_ITEMS = [
            { id: 'dashboard', label: 'Overview', icon: 'layout-dashboard' },
            { id: 'hunter', label: '1. Hunter', icon: 'target' },
            { id: 'pitcher', label: '2. Pitcher', icon: 'presentation' },
            { id: 'manager', label: '3. Manager', icon: 'kanban' },
            { id: 'farmer', label: '4. Farmer', icon: 'sprout' }
        ];

        // AI Configuration
        const API_KEY = ""; // Managed by environment
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`;

        // TikTok Custom SVG Icon
        const TikTokIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 15.68a6.34 6.34 0 0 0 6.27 6.32 6.32 6.32 0 0 0 6.22-5.71V8.62a8.3 8.3 0 0 0 4.2 1.13V6.3a4.7 4.7 0 0 1-2.1-.61Z"/>
            </svg>
        );

        const CatalystLogo = () => (
            <svg viewBox="0 0 100 100" className="w-8 h-8 flex-shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="15" fill="#3b82f6" />
                <path d="M50 30L55 45L70 50L55 55L50 70L45 55L30 50L45 45L50 30Z" fill="white" />
                <circle cx="50" cy="50" r="28" stroke="#3b82f6" strokeWidth="3" strokeDasharray="8 8" opacity="0.6"/>
                <circle cx="50" cy="50" r="42" stroke="#60a5fa" strokeWidth="2" strokeDasharray="4 12" opacity="0.3"/>
            </svg>
        );

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl">
                        <h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-6">{message}</p>
                        <div className="flex justify-end space-x-3">
                            <button onClick={onCancel} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium">Cancel</button>
                            <button onClick={onConfirm} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium">Delete</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ clients, pitches }) => {
            const metrics = [
                { label: "Total Leads", value: clients.length, icon: "users", color: "text-blue-600", bg: "bg-blue-100" },
                { label: "Active Pitches", value: pitches.length, icon: "mic", color: "text-purple-600", bg: "bg-purple-100" },
                { label: "Secured Clients", value: clients.filter(c => c.status === "Past").length, icon: "check-circle", color: "text-emerald-600", bg: "bg-emerald-100" }
            ];

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-6 md:space-y-8 h-full overflow-y-auto mobile-pb">
                    <div>
                        <h2 className="text-2xl md:text-3xl font-bold text-slate-800">Overview</h2>
                        <p className="text-slate-500 text-sm md:text-base mt-1">Your business development metrics at a glance.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                        {metrics.map((m, i) => (
                            <div key={i} className="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                                <div>
                                    <p className="text-sm text-slate-500 font-medium mb-1">{m.label}</p>
                                    <h3 className="text-2xl md:text-3xl font-bold text-slate-800">{m.value}</h3>
                                </div>
                                <div className={`p-3 md:p-4 rounded-xl ${m.bg} ${m.color}`}>
                                    <i data-lucide={m.icon} className="w-5 h-5 md:w-6 md:h-6"></i>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6">
                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                            <i data-lucide="target" className="w-5 h-5 mr-2 text-purple-500"></i> Recent Leads
                        </h3>
                        <div className="space-y-4">
                            {clients.length === 0 ? <p className="text-slate-500 text-sm">No leads yet.</p> : 
                            clients.slice(0, 5).map(c => (
                                <div key={c.id} className="flex justify-between items-center p-3 md:p-4 border border-slate-100 rounded-xl bg-slate-50">
                                    <div className="flex items-center">
                                        <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold mr-3 flex-shrink-0">
                                            {c.name.charAt(0)}
                                        </div>
                                        <div>
                                            <p className="font-semibold text-sm md:text-base text-slate-800 truncate max-w-[150px] md:max-w-xs">{c.name}</p>
                                            <p className="text-xs text-slate-500">{c.sector}</p>
                                        </div>
                                    </div>
                                    <span className={`text-xs px-2 py-1 rounded-md font-medium whitespace-nowrap ${
                                        c.status === 'Potential' ? 'bg-slate-200 text-slate-700' :
                                        c.status === 'Approaching' ? 'bg-blue-100 text-blue-700' :
                                        'bg-emerald-100 text-emerald-700'
                                    }`}>{c.status}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const Hunter = ({ clients, saveClient, deleteClient }) => {
            const [view, setView] = useState('crm'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState({ isOpen: false, id: null });
            const [isAutoFilling, setIsAutoFilling] = useState(false);
            
            const [formData, setFormData] = useState({ name: '', contact: '', status: 'Potential', sector: 'Tech', website: '', ig: '', li: '', yt: '', tiktok: '' });

            const [chatHistory, setChatHistory] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isBotTyping, setIsBotTyping] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => { if(view === 'strategy') chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, view]);

            const filteredClients = clients.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()) || c.sector.toLowerCase().includes(searchQuery.toLowerCase()));

            const openAddModal = () => {
                setEditingId(null);
                setFormData({ name: '', contact: '', status: 'Potential', sector: 'Tech', website: '', ig: '', li: '', yt: '', tiktok: '' });
                setShowModal(true);
            };

            const openEditModal = (client) => {
                setEditingId(client.id);
                setFormData(client);
                setShowModal(true);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                saveClient(formData, editingId);
                setShowModal(false);
            };

            const handleAutoFill = async () => {
                if(!formData.name) return;
                setIsAutoFilling(true);
                const prompt = `Find the official online presence for "${formData.name}" in Indonesia. Return ONLY a JSON object with these exact keys: website, ig, li, yt, tiktok. Leave empty string if not found.`;
                try {
                    const res = await fetch(API_URL, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            tools: [{ "google_search": {} }],
                            generationConfig: {
                                responseMimeType: "application/json",
                                responseSchema: { type: "OBJECT", properties: { website: { type: "STRING" }, ig: { type: "STRING" }, li: { type: "STRING" }, yt: { type: "STRING" }, tiktok: { type: "STRING" } } }
                            }
                        }) 
                    });
                    const data = await res.json();
                    if(data.candidates?.[0]?.content?.parts?.[0]?.text) {
                        setFormData(prev => ({ ...prev, ...JSON.parse(data.candidates[0].content.parts[0].text) }));
                    }
                } catch (err) { console.error(err); }
                setIsAutoFilling(false);
            };

            const handleSendChat = async (e) => {
                e.preventDefault();
                if(!chatInput.trim()) return;
                const userMsg = { role: 'user', text: chatInput };
                setChatHistory(prev => [...prev, userMsg]);
                setChatInput('');
                setIsBotTyping(true);

                const contents = chatHistory.map(msg => ({ role: msg.role === 'user' ? 'user' : 'model', parts: [{ text: msg.text }] }));
                contents.push({ role: 'user', parts: [{ text: userMsg.text }] });

                try {
                    const res = await fetch(API_URL, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({
                            contents: contents,
                            tools: [{ "google_search": {} }],
                            systemInstruction: { parts: [{ text: "You are an elite Business Development Strategist. Provide actionable ideation and market trends.\n\nCRITICAL: You MUST structure every single response EXACTLY with these three sections, using these exact headings:\n\n1. **Client Brief Input**: Summarize your understanding of the client and their position.\n2. **Event Strategy Recommendation**: Highly creative, data-backed activation ideas.\n3. **Pitch Deck Structure Recommendation**: Slide-by-slide outline to pitch these strategies." }] }
                        }) 
                    });
                    const data = await res.json();
                    let text = data.candidates[0].content.parts[0].text;
                    setChatHistory(prev => [...prev, { role: 'model', text }]);
                } catch (err) {
                    setChatHistory(prev => [...prev, { role: 'model', text: "Error connecting to AI network." }]);
                }
                setIsBotTyping(false);
            };

            return (
                <div className="h-full flex flex-col bg-white mobile-pb">
                    <ConfirmModal 
                        isOpen={deleteConfirm.isOpen} 
                        title="Delete Client" 
                        message="Are you sure you want to delete this client? This cannot be undone."
                        onConfirm={() => { deleteClient(deleteConfirm.id); setDeleteConfirm({isOpen: false, id: null}); }}
                        onCancel={() => setDeleteConfirm({isOpen: false, id: null})}
                    />

                    <div className="px-4 md:px-8 py-4 md:py-6 border-b border-slate-200 flex flex-col md:flex-row md:justify-between md:items-center bg-slate-50 space-y-4 md:space-y-0">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-slate-800 flex items-center">
                                <i data-lucide="target" className="w-5 h-5 md:w-6 md:h-6 mr-2 text-blue-600"></i> The Hunter
                            </h2>
                            <p className="text-slate-500 text-xs md:text-sm mt-1">CRM & Strategy</p>
                        </div>
                        <div className="flex space-x-1 bg-slate-200 p-1 rounded-lg self-start">
                            <button onClick={() => setView('crm')} className={`px-3 md:px-4 py-2 rounded-md text-xs md:text-sm font-medium transition-colors ${view === 'crm' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500'}`}>CRM Tracker</button>
                            <button onClick={() => setView('strategy')} className={`px-3 md:px-4 py-2 rounded-md text-xs md:text-sm font-medium transition-colors flex items-center ${view === 'strategy' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500'}`}>
                                <i data-lucide="sparkles" className="w-4 h-4 mr-1 text-purple-500"></i> AI Strategist
                            </button>
                        </div>
                    </div>

                    {view === 'crm' && (
                        <div className="p-4 md:p-8 flex-1 overflow-y-auto bg-slate-50 flex flex-col">
                            <div className="flex flex-col md:flex-row md:justify-between md:items-center mb-4 md:mb-6 space-y-3 md:space-y-0">
                                <div className="relative w-full md:w-64">
                                    <i data-lucide="search" className="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                                    <input type="text" placeholder="Search clients..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <button onClick={openAddModal} className="w-full md:w-auto bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center shadow-sm">
                                    <i data-lucide="plus" className="w-4 h-4 mr-1"></i> Add Target
                                </button>
                            </div>
                            
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                                <table className="w-full text-left min-w-[800px]">
                                    <thead className="bg-slate-100/50 border-b border-slate-200 text-slate-500 text-xs md:text-sm uppercase tracking-wider">
                                        <tr>
                                            <th className="p-4 font-medium">Company</th>
                                            <th className="p-4 font-medium">Status & Sector</th>
                                            <th className="p-4 font-medium">Contact</th>
                                            <th className="p-4 font-medium">Socials</th>
                                            <th className="p-4 font-medium text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {filteredClients.map(c => (
                                            <tr key={c.id} className="hover:bg-slate-50">
                                                <td className="p-4">
                                                    <p className="font-semibold text-slate-800">{c.name}</p>
                                                    {c.website && <a href={c.website.startsWith('http') ? c.website : `https://${c.website}`} target="_blank" className="text-xs text-blue-500 hover:underline">{c.website.replace('https://','')}</a>}
                                                </td>
                                                <td className="p-4">
                                                    <span className="block text-xs font-semibold mb-1 text-slate-600">{c.sector}</span>
                                                    <span className={`text-[10px] px-2 py-0.5 rounded-md font-bold uppercase tracking-wide border ${c.status === 'Potential' ? 'bg-slate-50 text-slate-500 border-slate-200' : c.status === 'Approaching' ? 'bg-blue-50 text-blue-600 border-blue-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}`}>{c.status}</span>
                                                </td>
                                                <td className="p-4 text-slate-600">{c.contact || '-'}</td>
                                                <td className="p-4">
                                                    <div className="flex space-x-3 text-slate-400">
                                                        {c.li && <a href={c.li} target="_blank"><i data-lucide="linkedin" className="w-4 h-4 hover:text-blue-700"></i></a>}
                                                        {c.ig && <a href={c.ig} target="_blank"><i data-lucide="instagram" className="w-4 h-4 hover:text-pink-600"></i></a>}
                                                        {c.yt && <a href={c.yt} target="_blank"><i data-lucide="youtube" className="w-4 h-4 hover:text-red-600"></i></a>}
                                                        {c.tiktok && <a href={c.tiktok} target="_blank"><TikTokIcon className="w-4 h-4 hover:text-black" /></a>}
                                                    </div>
                                                </td>
                                                <td className="p-4 text-right space-x-2">
                                                    <button onClick={() => openEditModal(c)} className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-md transition-colors"><i data-lucide="edit" className="w-4 h-4"></i></button>
                                                    <button onClick={() => setDeleteConfirm({isOpen: true, id: c.id})} className="p-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-md transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {view === 'strategy' && (
                        <div className="flex-1 flex flex-col bg-slate-50">
                            <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
                                {chatHistory.map((msg, i) => (
                                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[90%] md:max-w-[80%] p-4 rounded-2xl text-sm ${msg.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai border border-slate-200'}`} dangerouslySetInnerHTML={{__html: msg.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br/>')}}></div>
                                    </div>
                                ))}
                                {isBotTyping && <div className="chat-bubble-ai p-4 rounded-2xl w-16 flex justify-center space-x-1"><div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></div><div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay:'0.2s'}}></div></div>}
                                <div ref={chatEndRef}></div>
                            </div>
                            <div className="p-3 md:p-4 bg-white border-t border-slate-200">
                                <form onSubmit={handleSendChat} className="flex relative max-w-4xl mx-auto">
                                    <input type="text" value={chatInput} onChange={e=>setChatInput(e.target.value)} placeholder="Ask AI Strategist..." className="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-300 focus:outline-none text-sm" />
                                    <button type="submit" disabled={isBotTyping || !chatInput} className="absolute right-2 top-2 bottom-2 bg-blue-600 text-white rounded-lg px-3"><i data-lucide="send" className="w-4 h-4"></i></button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Form Modal */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-2 md:p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
                                <div className="px-4 md:px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                                    <h3 className="font-bold text-lg text-slate-800">{editingId ? 'Edit Client' : 'Add Client'}</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:bg-slate-200 p-1 rounded-md"><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <form onSubmit={handleSubmit} className="p-4 md:p-6 overflow-y-auto space-y-4 md:space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">Company Name *</label>
                                            <input required type="text" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
                                        </div>
                                        <div className="flex items-end">
                                            <button type="button" onClick={handleAutoFill} disabled={isAutoFilling} className="w-full bg-indigo-50 text-indigo-700 border border-indigo-200 font-medium py-2 px-3 rounded-lg flex justify-center text-sm">
                                                {isAutoFilling ? 'Searching...' : '✨ Spark AI Auto-fill'}
                                            </button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="sm:col-span-2"><label className="block text-xs font-semibold text-slate-500 mb-1">Contact</label><input type="text" value={formData.contact} onChange={e=>setFormData({...formData, contact: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm outline-none" /></div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">Sector</label>
                                            <select value={formData.sector} onChange={e=>setFormData({...formData, sector: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm outline-none bg-white">
                                                {SECTORS.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                                            <select value={formData.status} onChange={e=>setFormData({...formData, status: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm outline-none bg-white">
                                                {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="border-t pt-4"><h4 className="text-sm font-semibold mb-3">Links</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            <input type="text" placeholder="Website" value={formData.website} onChange={e=>setFormData({...formData, website: e.target.value})} className="border rounded-lg px-3 py-2 text-sm outline-none" />
                                            <input type="text" placeholder="LinkedIn URL" value={formData.li} onChange={e=>setFormData({...formData, li: e.target.value})} className="border rounded-lg px-3 py-2 text-sm outline-none" />
                                            <input type="text" placeholder="Instagram URL" value={formData.ig} onChange={e=>setFormData({...formData, ig: e.target.value})} className="border rounded-lg px-3 py-2 text-sm outline-none" />
                                            <input type="text" placeholder="TikTok URL" value={formData.tiktok} onChange={e=>setFormData({...formData, tiktok: e.target.value})} className="border rounded-lg px-3 py-2 text-sm outline-none" />
                                        </div>
                                    </div>
                                    <div className="flex justify-end pt-4"><button type="submit" className="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium text-sm">Save</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Pitcher = ({ pitches, clients, savePitch, deletePitch }) => {
            const [searchQuery, setSearchQuery] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState({ isOpen: false, id: null });
            const [formData, setFormData] = useState({ clientId: '', name: '', deckLink: '', subDate: '', pitchDate: '', eventDate: '' });

            const filteredPitches = pitches.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));

            const openAddModal = () => {
                setEditingId(null);
                setFormData({ clientId: clients[0]?.id || '', name: '', deckLink: '', subDate: '', pitchDate: '', eventDate: '' });
                setShowModal(true);
            };

            const openEditModal = (pitch) => {
                setEditingId(pitch.id);
                setFormData(pitch);
                setShowModal(true);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                savePitch(formData, editingId);
                setShowModal(false);
            };

            const generateGCalLink = (pitch) => {
                const client = clients.find(c => c.id === pitch.clientId);
                const title = encodeURIComponent(`Pitch: ${pitch.name} - ${client ? client.name : 'Client'}`);
                
                const formatForGCal = (dateString) => {
                    if(!dateString) return "";
                    const d = new Date(dateString);
                    return d.toISOString().replace(/-|:|\.\d\d\d/g,"");
                };

                let datesStr = "";
                if(pitch.pitchDate) {
                    const start = formatForGCal(pitch.pitchDate);
                    const end = formatForGCal(new Date(new Date(pitch.pitchDate).getTime() + 60*60*1000));
                    datesStr = `&dates=${start}/${end}`;
                }

                const details = encodeURIComponent(`Client: ${client ? client.name : 'N/A'}\nDeck Link: ${pitch.deckLink}\nSubmission Deadline: ${pitch.subDate}\nEvent Date: ${pitch.eventDate}`);
                return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}${datesStr}&details=${details}`;
            };

            return (
                <div className="h-full flex flex-col bg-slate-50 mobile-pb">
                    <ConfirmModal 
                        isOpen={deleteConfirm.isOpen} title="Delete Pitch" message="Are you sure?"
                        onConfirm={() => { deletePitch(deleteConfirm.id); setDeleteConfirm({isOpen: false, id: null}); }}
                        onCancel={() => setDeleteConfirm({isOpen: false, id: null})}
                    />

                    <div className="px-4 md:px-8 py-4 md:py-6 flex flex-col md:flex-row justify-between items-start md:items-center bg-white border-b space-y-4 md:space-y-0">
                        <div>
                            <h2 className="text-xl md:text-2xl font-bold text-slate-800 flex items-center">
                                <i data-lucide="presentation" className="w-5 h-5 md:w-6 md:h-6 mr-2 text-purple-600"></i> The Pitcher
                            </h2>
                            <p className="text-slate-500 text-xs md:text-sm mt-1">Creative Decks & Deadlines</p>
                        </div>
                        <div className="flex w-full md:w-auto space-x-2">
                            <div className="relative flex-1 md:w-64">
                                <i data-lucide="search" className="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                                <input type="text" placeholder="Search projects..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
                            </div>
                            <button onClick={openAddModal} className="bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-medium flex-shrink-0 flex items-center">
                                <i data-lucide="plus" className="w-4 h-4 md:mr-1"></i> <span className="hidden md:inline">New Pitch</span>
                            </button>
                        </div>
                    </div>

                    <div className="p-4 md:p-8 flex-1 overflow-y-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                        {filteredPitches.map(p => {
                            const client = clients.find(c => c.id === p.clientId);
                            return (
                                <div key={p.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col relative group">
                                    <div className="absolute top-4 right-4 flex space-x-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                                        <button onClick={() => openEditModal(p)} className="p-1.5 bg-slate-100 text-slate-600 rounded hover:text-purple-600 transition-colors"><i data-lucide="edit" className="w-4 h-4"></i></button>
                                        <button onClick={() => setDeleteConfirm({isOpen: true, id: p.id})} className="p-1.5 bg-red-50 text-red-600 rounded hover:bg-red-100 transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                    </div>
                                    <h3 className="font-bold text-lg pr-16">{p.name}</h3>
                                    <p className="text-sm text-purple-600 font-medium mb-4">{client ? client.name : 'Unknown'}</p>
                                    
                                    <div className="space-y-2 mb-4 flex-1 text-sm text-slate-600">
                                        <div className="flex"><i data-lucide="alert-circle" className="w-4 h-4 mr-2 text-amber-500"></i>Sub: {p.subDate || '-'}</div>
                                        <div className="flex"><i data-lucide="calendar" className="w-4 h-4 mr-2 text-blue-500"></i>Pitch: {p.pitchDate ? new Date(p.pitchDate).toLocaleString() : '-'}</div>
                                        <div className="flex"><i data-lucide="flag" className="w-4 h-4 mr-2 text-emerald-500"></i>Live: {p.eventDate || '-'}</div>
                                    </div>
                                    <div className="flex space-x-2">
                                        {p.deckLink && <a href={p.deckLink} target="_blank" className="flex-1 bg-slate-100 hover:bg-slate-200 text-center py-2 rounded-lg text-sm font-medium flex justify-center items-center"><i data-lucide="link" className="w-4 h-4 mr-1"></i> Deck</a>}
                                        <a href={generateGCalLink(p)} target="_blank" className="flex-1 border border-slate-200 hover:border-blue-400 hover:text-blue-600 text-center py-2 rounded-lg text-sm font-medium flex justify-center items-center"><i data-lucide="calendar-plus" className="w-4 h-4 mr-1"></i> GCal</a>
                                    </div>
                                </div>
                            )
                        })}
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6">
                                <h3 className="font-bold text-lg mb-4">{editingId ? 'Edit Pitch' : 'New Pitch'}</h3>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <select required value={formData.clientId} onChange={e=>setFormData({...formData, clientId: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm">
                                        <option value="">Select Client...</option>
                                        {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                    <input required type="text" placeholder="Project Name" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm" />
                                    <input type="url" placeholder="Deck Link URL" value={formData.deckLink} onChange={e=>setFormData({...formData, deckLink: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm" />
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="text-xs text-slate-500">Submission</label><input type="date" value={formData.subDate} onChange={e=>setFormData({...formData, subDate: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm" /></div>
                                        <div><label className="text-xs text-slate-500">Pitch Date</label><input type="datetime-local" value={formData.pitchDate} onChange={e=>setFormData({...formData, pitchDate: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-sm" /></div>
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-2">
                                        <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-slate-600">Cancel</button>
                                        <button type="submit" className="px-4 py-2 bg-purple-600 text-white rounded-lg">Save</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [clients, setClients] = useState([]);
            const [pitches, setPitches] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                initAuth();
                const unsub = onAuthStateChanged(auth, u => { setUser(u); setLoading(false); });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user) return;
                const cRef = collection(db, 'artifacts', appId, 'users', user.uid, 'clients');
                const pRef = collection(db, 'artifacts', appId, 'users', user.uid, 'pitches');
                
                const unsubC = onSnapshot(cRef, snap => setClients(snap.docs.map(d => ({id: d.id, ...d.data()}))), err => console.error(err));
                const unsubP = onSnapshot(pRef, snap => setPitches(snap.docs.map(d => ({id: d.id, ...d.data()}))), err => console.error(err));
                
                return () => { unsubC(); unsubP(); };
            }, [user]);

            useEffect(() => { lucide.createIcons(); }, [activeTab, clients, pitches]);

            const saveClient = async (data, id) => {
                if(!user) return;
                const ref = id ? doc(db, 'artifacts', appId, 'users', user.uid, 'clients', id) : collection(db, 'artifacts', appId, 'users', user.uid, 'clients');
                id ? await updateDoc(ref, data) : await addDoc(ref, data);
            };
            const deleteClient = async (id) => await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'clients', id));
            
            const savePitch = async (data, id) => {
                if(!user) return;
                const ref = id ? doc(db, 'artifacts', appId, 'users', user.uid, 'pitches', id) : collection(db, 'artifacts', appId, 'users', user.uid, 'pitches');
                id ? await updateDoc(ref, data) : await addDoc(ref, data);
            };
            const deletePitch = async (id) => await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'pitches', id));

            if (loading) return <div className="h-screen flex items-center justify-center bg-slate-50"><div className="spinner"></div></div>;

            return (
                <div className="flex h-screen overflow-hidden bg-slate-100">
                    {/* Desktop Sidebar */}
                    <div className="hidden md:flex w-64 bg-slate-900 text-slate-300 flex-col h-full z-20">
                        <div className="p-6 flex items-center border-b border-slate-800 mb-4"><CatalystLogo /><h1 className="ml-3 text-xl font-bold text-white">Catalyst<span className="text-blue-500">BD</span></h1></div>
                        <nav className="flex-1 px-4 space-y-2">
                            {NAV_ITEMS.map(i => (
                                <button key={i.id} onClick={() => setActiveTab(i.id)} className={`w-full flex items-center p-3 rounded-lg transition-colors ${activeTab === i.id ? 'bg-blue-600 text-white' : 'hover:bg-slate-800'}`}>
                                    <i data-lucide={i.icon} className="w-5 h-5 mr-3"></i><span className="font-medium">{i.label}</span>
                                </button>
                            ))}
                        </nav>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 relative overflow-hidden">
                        {activeTab === 'dashboard' && <Dashboard clients={clients} pitches={pitches} />}
                        {activeTab === 'hunter' && <Hunter clients={clients} saveClient={saveClient} deleteClient={deleteClient} />}
                        {activeTab === 'pitcher' && <Pitcher pitches={pitches} clients={clients} savePitch={savePitch} deletePitch={deletePitch} />}
                        {(activeTab === 'manager' || activeTab === 'farmer') && (
                            <div className="h-full flex flex-col items-center justify-center p-8 text-center text-slate-500 mobile-pb">
                                <i data-lucide={activeTab==='manager'?'kanban':'sprout'} className="w-16 h-16 mb-4 opacity-50"></i>
                                <h2 className="text-2xl font-bold text-slate-800 mb-2">In Development</h2>
                                <p>This workspace module is coming soon.</p>
                            </div>
                        )}
                    </main>

                    {/* Mobile Bottom Nav */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 flex justify-around pb-safe">
                        {NAV_ITEMS.slice(0,4).map(i => (
                            <button key={i.id} onClick={() => setActiveTab(i.id)} className={`flex flex-col items-center justify-center w-full py-3 ${activeTab === i.id ? 'text-blue-600' : 'text-slate-400'}`}>
                                <i data-lucide={i.icon} className="w-6 h-6 mb-1"></i>
                                <span className="text-[10px] font-medium">{i.label.replace(/[0-9].\s/g, '')}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
